syntax = "proto3";

package carbonpanel.v1;

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// PackwizService is the generated control contract for Packwiz pack management.
// It covers the JSON pack-control operations; binary upload/import, pack file
// delivery and export archives remain HTTP per ADR 0012. The legacy
// /api/v1/packwiz/packs routes remain compatibility adapters during the
// deprecation window and share one PackwizOperations instance with this service.
service PackwizService {
  // ListPacks lists available Packwiz projects.
  rpc ListPacks(ListPacksRequest) returns (ListPacksResponse);
  // GetPack returns one pack with its content lists.
  rpc GetPack(GetPackRequest) returns (GetPackResponse);
  // ClonePack copies a pack under a new name.
  rpc ClonePack(ClonePackRequest) returns (ClonePackResponse);
  // RefreshPack re-indexes a pack's content lists.
  rpc RefreshPack(RefreshPackRequest) returns (RefreshPackResponse);
  // CheckUpdates lists available content updates for a pack.
  rpc CheckUpdates(CheckUpdatesRequest) returns (CheckUpdatesResponse);
  // DeletePack removes a pack and its metadata.
  rpc DeletePack(DeletePackRequest) returns (DeletePackResponse);
  // AddPackMod adds a mod entry to a pack, optionally resolving dependencies.
  rpc AddPackMod(AddPackModRequest) returns (AddPackModResponse);
  // AddUrlMod adds a mod from a direct download URL.
  rpc AddUrlMod(AddUrlModRequest) returns (AddUrlModResponse);
  // UpdatePackMod changes a mod's side and pinned flag.
  rpc UpdatePackMod(UpdatePackModRequest) returns (UpdatePackModResponse);
  // DeletePackMod removes a mod from a pack.
  rpc DeletePackMod(DeletePackModRequest) returns (DeletePackModResponse);
  // BatchPackMods applies one action to several mods in a pack.
  rpc BatchPackMods(BatchPackModsRequest) returns (BatchPackModsResponse);
}

// PackSummary is one entry of the pack list.
message PackSummary {
  string id = 1;
  string name = 2;
  string author = 3;
  string version = 4;
  string mc_version = 5;
  string mod_loader = 6;
  string loader_version = 7;
  int32 mod_count = 8;
  string updated_at = 9;
}

// PackMod is one content entry stored in a pack.
message PackMod {
  string slug = 1;
  string name = 2;
  string file_name = 3;
  string side = 4;
  string platform = 5;
  string project_id = 6;
  string version_id = 7;
  string download_url = 8;
  int64 file_size = 9;
  bool pinned = 10;
  string kind = 11;
  bool optional = 12;
  bool default = 13;
  string option_description = 14;
  string hash = 15;
  string hash_format = 16;
  string sha512 = 17;
}

// Pack is a full Packwiz project.
message Pack {
  string id = 1;
  string name = 2;
  string author = 3;
  string version = 4;
  string mc_version = 5;
  string mod_loader = 6;
  string loader_version = 7;
  string updated_at = 8;
  repeated PackMod mods = 9;
  repeated PackMod datapacks = 10;
  repeated PackMod resourcepacks = 11;
  repeated PackMod shaderpacks = 12;
  string datapack_folder = 13;
  string options = 14;
}

// PackUpdate describes an available content update.
message PackUpdate {
  string slug = 1;
  string name = 2;
  string kind = 3;
  string platform = 4;
  string current_version_id = 5;
  string latest_version_id = 6;
  string latest_file_name = 7;
  string latest_download_url = 8;
  string latest_hash_format = 9;
  string latest_hash = 10;
  string latest_sha512 = 11;
  string changelog = 12;
  bool update_available = 13;
  bool pinned = 14;
}

// ListPacksRequest is empty; pack control is globally authorized.
message ListPacksRequest {}

// ListPacksResponse is the pack list.
message ListPacksResponse {
  repeated PackSummary packs = 1;
}

// GetPackRequest identifies a pack by id.
message GetPackRequest {
  string pack_id = 1;
}

// GetPackResponse returns the requested pack.
message GetPackResponse {
  Pack pack = 1;
}

// ClonePackRequest carries the source pack and the new name.
message ClonePackRequest {
  string pack_id = 1;
  string name = 2;
}

// ClonePackResponse returns the cloned pack.
message ClonePackResponse {
  Pack pack = 1;
}

// RefreshPackRequest identifies a pack to re-index.
message RefreshPackRequest {
  string pack_id = 1;
}

// RefreshPackResponse acknowledges a refresh.
message RefreshPackResponse {
  bool success = 1;
  string message = 2;
}

// CheckUpdatesRequest identifies a pack and an optional content kind filter.
message CheckUpdatesRequest {
  string pack_id = 1;
  string kind = 2;
}

// CheckUpdatesResponse lists available updates after filtering.
message CheckUpdatesResponse {
  repeated PackUpdate updates = 1;
}

// DeletePackRequest identifies a pack to delete.
message DeletePackRequest {
  string pack_id = 1;
}

// DeletePackResponse acknowledges a delete.
message DeletePackResponse {
  bool success = 1;
}

// AddPackModRequest adds a mod entry. The optional dependency fields mirror the
// legacy resolve_dependencies=true query so both transports share one operation.
message AddPackModRequest {
  string pack_id = 1;
  PackMod mod = 2;
  bool resolve_dependencies = 3;
  string loader = 4;
  string mc_version = 5;
}

// PackDependencyRef is one unresolvable required dependency reported by a
// dependency-aware add. It mirrors the legacy JSON object field for field,
// including the platform discriminator (modrinth vs curseforge), so a caller
// can choose the right provider for a follow-up resolution attempt.
message PackDependencyRef {
  string project_id = 1;
  string version_id = 2;
  string title = 3;
  string dependency_type = 4;
  string platform = 5;
}

// AddPackModResponse reports an add and, when requested, dependency resolution.
// A resolver failure is reported as a soft result because the requested mod was
// already installed, matching the compatibility adapter.
message AddPackModResponse {
  bool success = 1;
  string dependency_error = 2;
  repeated PackMod added_dependencies = 3;
  repeated string skipped = 4;
  repeated PackDependencyRef unresolved = 5;
}

// AddUrlModRequest adds a mod from a direct download URL.
message AddUrlModRequest {
  string pack_id = 1;
  string name = 2;
  string file_name = 3;
  string download_url = 4;
  string side = 5;
  bool pinned = 6;
}

// AddUrlModResponse returns the stored mod entry.
message AddUrlModResponse {
  PackMod mod = 1;
}

// UpdatePackModRequest changes one mod's side and pinned flag.
message UpdatePackModRequest {
  string pack_id = 1;
  string slug = 2;
  string side = 3;
  bool pinned = 4;
}

// UpdatePackModResponse acknowledges a mod update.
message UpdatePackModResponse {
  bool success = 1;
}

// DeletePackModRequest removes one mod from a pack.
message DeletePackModRequest {
  string pack_id = 1;
  string slug = 2;
}

// DeletePackModResponse acknowledges a mod removal.
message DeletePackModResponse {
  bool success = 1;
}

// BatchPackModsRequest applies one action (set_side, pin, unpin, remove) to a
// set of mod slugs.
message BatchPackModsRequest {
  string pack_id = 1;
  string action = 2;
  repeated string slugs = 3;
  string side = 4;
}

// BatchPackModsResponse reports how many slugs were processed.
message BatchPackModsResponse {
  bool success = 1;
  int32 count = 2;
}
