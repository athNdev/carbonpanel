syntax = "proto3";

package carbonpanel.v1;

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// Server file management
service FileService {
  // Browse server directory
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // Download file content
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  // Save an uploaded file
  rpc SaveUploadedFile(SaveUploadedFileRequest) returns (SaveUploadedFileResponse);
  // Modify file content
  rpc UpdateFile(UpdateFileRequest) returns (UpdateFileResponse);
  // Remove file or directory
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // Change file name
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  // Unzip archive file
  rpc ExtractArchive(ExtractArchiveRequest) returns (ExtractArchiveResponse);
  // Create a new folder
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  // Move a file or directory
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse);
  // Copy a file or directory
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse);
  // Create a zip archive from selected paths
  rpc CreateArchive(CreateArchiveRequest) returns (CreateArchiveResponse);
  // Download multiple files/folders as a zip
  rpc DownloadArchive(DownloadArchiveRequest) returns (DownloadArchiveResponse);
  // Export the server world as a zip. The server, container, and world directory stay.
  rpc ExportWorld(ExportWorldRequest) returns (ExportWorldResponse);
  // Initiate a single-file download session (actual bytes served via GET /api/v1/download/{session_id})
  rpc InitFileDownload(InitFileDownloadRequest) returns (InitFileDownloadResponse);
  // Poll extraction progress
  rpc GetExtractionStatus(GetExtractionStatusRequest) returns (GetExtractionStatusResponse);
  // Download archive from remote URL (GitHub Releases, CDN, S3) with SHA256 verification and auto-extraction
  rpc DownloadRemoteArchive(DownloadRemoteArchiveRequest) returns (DownloadRemoteArchiveResponse);
  // Poll remote archive download progress
  rpc GetRemoteArchiveProgress(GetRemoteArchiveProgressRequest) returns (GetRemoteArchiveProgressResponse);
  // OSS-387: open a controller-owned bounded byte stream session. The gateway
  // never opens node storage itself; the controller owns the read handle.
  // With download_session_id set, the bounded handle is opened over a staged
  // download (InitFileDownload/DownloadArchive/ExportWorld) instead of a
  // server-relative node path; server_id must still match the session's server.
  rpc OpenStream(OpenStreamRequest) returns (OpenStreamResponse);
  // Read one bounded frame from a controller-owned session.
  rpc ReadStreamFrame(ReadStreamFrameRequest) returns (ReadStreamFrameResponse);
  // Close or cancel a controller-owned session.
  rpc CloseStream(CloseStreamRequest) returns (CloseStreamResponse);
}

// OSS-387 bounded stream session messages. Frames are capped by the W17
// 256 KiB bound; the controller owns handles, expiry and SHA-256 state.
//
// CONTRACT: total_size / size is an ADMISSION UPPER BOUND, not an exact byte
// count. The controller refuses to read beyond it, but the source may be
// shorter. The authoritative final byte count is ReadStreamFrameResponse.offset
// on the frame with done=true; its sha256 is computed over exactly those
// bytes. Composed upload/commit MUST use that actual count, never the declared
// bound. A declared size of 0 is valid for opening but yields no committable
// bytes.
message OpenStreamRequest {
  string server_id = 1;
  string path = 2;
  int64 total_size = 3;
  // OSS-370: when set, open the bounded frame stream over the controller-owned
  // staged file of this download session instead of a server-relative path.
  // The session's own server_id must equal server_id, and every frame remains
  // re-authorized to files/read[server_id] by the production interceptor. The
  // gateway never sees a storage path or holds a storage handle.
  string download_session_id = 4;
}
// Opaque controller session id plus the admission upper bound echoed back to
// the caller. The authoritative transferred size comes from frame responses.
message OpenStreamResponse {
  string session_id = 1;
  int64 size = 2;
}
// Requests exactly one bounded frame, identified by its zero-based index and
// the server this request is authorized for.
message ReadStreamFrameRequest {
  string session_id = 1;
  int32 frame_index = 2;
  // The server the caller intends to read from. The controller rejects the
  // frame unless it matches the server the session was opened for; the auth
  // interceptor also scopes this procedure to files/read[server_id].
  string server_id = 3;
}
// One bounded frame with cumulative SHA-256 and the authoritative byte
// offset; done=true marks the final frame.
message ReadStreamFrameResponse {
  bytes data = 1;
  // done=true means the source reached EOF. sha256 is the cumulative digest of
  // the bytes actually transferred, and offset is the authoritative ACTUAL
  // total byte count (not OpenStreamResponse.size, which is only a bound).
  bool done = 2;
  string sha256 = 3;
  int64 offset = 4;
}
// Releases exactly one owned session; cancel=true aborts an in-flight stream.
message CloseStreamRequest {
  string session_id = 1;
  bool cancel = 2;
  // The server the caller intends to close/release; must match the session.
  string server_id = 3;
}
// Empty acknowledgement that the owned session and its handle were released.
message CloseStreamResponse {}

// File metadata and tree
message FileInfo {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  int64 size = 4;
  int64 modified = 5;
  bool is_editable = 6;
  repeated FileInfo children = 7;
}

// Directory listing parameters
message ListFilesRequest {
  string server_id = 1;
  string path = 2;
  bool tree = 3;
}

// Directory contents
message ListFilesResponse {
  repeated FileInfo files = 1;
}

// File download parameters
message GetFileRequest {
  string server_id = 1;
  string path = 2;
}

// File binary content
message GetFileResponse {
  bytes content = 1;
  string mime_type = 2;
}

// File upload data
message SaveUploadedFileRequest {
  string server_id = 1;
  string upload_session_id = 2;
  string destination_path = 3; // Target dir
  string filename = 4; // Target filename
}

// Save uploaded file result
message SaveUploadedFileResponse {
  string message = 1;
  string path = 2;
}

// File content update
message UpdateFileRequest {
  string server_id = 1;
  string path = 2;
  bytes content = 3;
  // stage keeps the new bytes out of the live path until the batch applies.
  bool stage = 4;
}

// Update confirmation
message UpdateFileResponse {
  string message = 1;
  string path = 2;
  bool staged = 3;
}

// File to delete
message DeleteFileRequest {
  string server_id = 1;
  string path = 2;
  repeated string paths = 3; // Bulk delete
  // stage records the deletion and leaves the live files in place.
  bool stage = 4;
}

// Empty delete response
message DeleteFileResponse {}

// Folder creation parameters
message CreateFolderRequest {
  string server_id = 1;
  string path = 2;
}

// Folder creation result
message CreateFolderResponse {
  string message = 1;
}

// File move parameters
message MoveFileRequest {
  string server_id = 1;
  string source_path = 2;
  string destination_path = 3;
}

// File move result
message MoveFileResponse {
  string message = 1;
}

// File copy parameters
message CopyFileRequest {
  string server_id = 1;
  string source_path = 2;
  string destination_path = 3;
}

// File copy result
message CopyFileResponse {
  string message = 1;
}

// Archive creation parameters
message CreateArchiveRequest {
  string server_id = 1;
  repeated string paths = 2;
  string destination_path = 3;
  string archive_name = 4;
}

// Archive creation result
message CreateArchiveResponse {
  string message = 1;
  string archive_path = 2;
  int32 files_archived = 3;
}

// Archive download parameters
message DownloadArchiveRequest {
  string server_id = 1;
  repeated string paths = 2;
}

// Archive download session
message DownloadArchiveResponse {
  string session_id = 1;
  string filename = 2;
  int64 total_size = 3;
}

// Server world to export
message ExportWorldRequest {
  string server_id = 1;
}

// Download session for the exported world
message ExportWorldResponse {
  string session_id = 1;
  string filename = 2;
  int64 total_size = 3;
  // World directory that was copied into the zip and left in place.
  string data_path = 4;
}

// File rename parameters
message RenameFileRequest {
  string server_id = 1;
  string path = 2;
  string new_name = 3;
}

// Rename result
message RenameFileResponse {
  string message = 1;
  string new_path = 2;
}

// Archive to extract
message ExtractArchiveRequest {
  string server_id = 1;
  string path = 2;
}

// Extraction started
message ExtractArchiveResponse {
  string operation_id = 1;
}

// Extraction status poll
message GetExtractionStatusRequest {
  string operation_id = 1;
}

// Extraction progress
message GetExtractionStatusResponse {
  string state = 1;
  int32 files_extracted = 2;
  string error = 3;
}

// Single file download session
message InitFileDownloadRequest {
  string server_id = 1;
  string path = 2;
}

// Download session
message InitFileDownloadResponse {
  string session_id = 1;
  string filename = 2;
  int64 total_size = 3;
}

// Download archive from remote URL request
message DownloadRemoteArchiveRequest {
  string server_id = 1;
  string url = 2;
  string destination_path = 3;
  string sha256_checksum = 4;
  bool auto_extract = 5;
}

// Download archive from remote URL response
message DownloadRemoteArchiveResponse {
  string task_id = 1;
  string message = 2;
}

// Get remote archive download progress request
message GetRemoteArchiveProgressRequest {
  string server_id = 1;
  string task_id = 2;
}

// Get remote archive download progress response
message GetRemoteArchiveProgressResponse {
  string task_id = 1;
  string status = 2;
  int64 bytes_downloaded = 3;
  int64 total_bytes = 4;
  int32 progress_percent = 5;
  string error = 6;
}

