syntax = "proto3";

package carbonpanel.v1;

import "google/protobuf/timestamp.proto";
import "carbonpanel/v1/config.proto";

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// Server mod management
service ModService {
  // List server mods
  rpc ListMods(ListModsRequest) returns (ListModsResponse);
  // Get mod details
  rpc GetMod(GetModRequest) returns (GetModResponse);
  // Import mod from chunked upload session
  rpc ImportUploadedMod(ImportUploadedModRequest) returns (ImportUploadedModResponse);
  // Update mod metadata
  rpc UpdateMod(UpdateModRequest) returns (UpdateModResponse);
  // Delete mod file
  rpc DeleteMod(DeleteModRequest) returns (DeleteModResponse);
  // Get Fabric optimization stack status and compatibility for a server
  rpc GetFabricOptimizationStack(GetFabricOptimizationStackRequest) returns (GetFabricOptimizationStackResponse);
  // Install or update Fabric optimization stack mods (Lithium, FerriteCore, ModernFix, C2ME)
  rpc InstallFabricOptimizationStack(InstallFabricOptimizationStackRequest) returns (InstallFabricOptimizationStackResponse);
}

// Server mod metadata
message Mod {
  string id = 1;
  string server_id = 2;
  string file_name = 3;
  string display_name = 4;
  string description = 5;
  string version = 6;
  string mod_id = 7; // External mod ID (e.g., CurseForge ID)
  string author = 8;
  string website = 9;
  int64 file_size = 10;
  google.protobuf.Timestamp uploaded_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  bool enabled = 13;
  // Present only when the caller explicitly checks this installed file for updates.
  InstalledModUpdate update_preview = 14;
}

// A read-only observation about the exact server file and the provider release.
message InstalledModUpdate {
  string state = 1; // available, current, unknown_source, review_required, unavailable
  string reason = 2;
  string installed_sha512 = 3;
  string provider = 4;
  string project_id = 5;
  string installed_version_id = 6;
  string installed_version = 7;
  string candidate_version_id = 8;
  string candidate_version = 9;
  string candidate_sha512 = 10;
  string candidate_filename = 11;
}

// One operator-reviewed replacement. The service re-verifies the installed
// fingerprint and the provider release before it stages any bytes.
message ModUpdateSelection {
  string mod_id = 1;
  string file_name = 2;
  string installed_sha512 = 3;
  string candidate_version_id = 4;
  string candidate_sha512 = 5;
  string candidate_filename = 6;
}

// Per-selection outcome of a staging request.
message StagedModUpdate {
  string mod_id = 1;
  string file_name = 2;
  string staged_id = 3;
  // staged, already_staged, already_selected, retryable, transient_download,
  // refused_drift, refused_provider, refused_download, refused_checksum,
  // refused_stale_preview, refused_limit, error
  string outcome = 4;
  string reason = 5;
}

// Server mods request
message ListModsRequest {
  string server_id = 1;
  // Hash installed bytes and check the provider for compatible release versions.
  bool check_updates = 2;
}

// All server mods
message ListModsResponse {
  repeated Mod mods = 1;
}

// Mod lookup
message GetModRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Mod details
message GetModResponse {
  Mod mod = 1;
}

// Import mod from chunked upload session
message ImportUploadedModRequest {
  string server_id = 1;
  string upload_session_id = 2;
  string display_name = 3;
  string description = 4;
  // stage keeps the jar out of the live mods directory until the batch applies.
  bool stage = 5;
}

// Import result
message ImportUploadedModResponse {
  Mod mod = 1;
  string message = 2;
  bool staged = 3;
}

// Mod fields to update
message UpdateModRequest {
  string server_id = 1;
  string mod_id = 2;
  optional string display_name = 3;
  optional string description = 4;
  optional bool enabled = 5;
  // A reviewed provider update stages exact replacement bytes into the
  // server's open batch. This reuses this procedure's mods/update scope.
  repeated ModUpdateSelection update_selections = 6;
  ConfigApplyWindow update_window = 7;
  int64 update_apply_at_unix = 8;
  int32 update_idle_minutes = 9;
}

// Updated mod
message UpdateModResponse {
  Mod mod = 1;
  repeated StagedModUpdate staged_updates = 2;
  string update_batch_id = 3;
}

// Mod to delete
message DeleteModRequest {
  string server_id = 1;
  string mod_id = 2;
}

// Deletion confirmation
message DeleteModResponse {
  string message = 1;
}

// Fabric optimization mod item
message FabricOptimizationMod {
  string mod_id = 1;                  // e.g. "lithium", "ferrite-core", "modernfix", "c2me-fabric"
  string name = 2;                    // e.g. "Lithium", "FerriteCore", "ModernFix", "C2ME"
  string description = 3;             // Mod optimization description
  bool installed = 4;
  bool compatible = 5;
  string installed_version = 6;
  string latest_compatible_version = 7;
  string file_name = 8;
  string download_url = 9;
}

// Get Fabric optimization stack request
message GetFabricOptimizationStackRequest {
  string server_id = 1;
}

// Get Fabric optimization stack response
message GetFabricOptimizationStackResponse {
  bool is_fabric = 1;
  string mc_version = 2;
  repeated FabricOptimizationMod mods = 3;
}

// Install Fabric optimization stack request
message InstallFabricOptimizationStackRequest {
  string server_id = 1;
  repeated string mod_ids = 2; // Optional filter; empty installs all 4
}

// Install Fabric optimization stack response
message InstallFabricOptimizationStackResponse {
  repeated FabricOptimizationMod installed_mods = 1;
  repeated string warnings = 2;
  string message = 3;
}
