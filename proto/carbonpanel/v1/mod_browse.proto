syntax = "proto3";

package carbonpanel.v1;

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// ModBrowseService is the generated control contract for online mod browse,
// version lookup and one-click install. The legacy /api/v1/servers/{id}/mods/*
// JSON routes remain as compatibility adapters during the deprecation window;
// both transports share one application operation and permission scope.
service ModBrowseService {
  // SearchMods queries a mod index for installable mods.
  rpc SearchMods(SearchModsRequest) returns (SearchModsResponse);
  // GetModVersions lists installable versions of a mod project.
  rpc GetModVersions(GetModVersionsRequest) returns (GetModVersionsResponse);
  // InstallMods downloads selected mod jars into a server's mods directory.
  rpc InstallMods(InstallModsRequest) returns (InstallModsResponse);
}

// BrowseModResult is one index hit as presented by the mod browser.
message BrowseModResult {
  string id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  string icon_url = 5;
  string author = 6;
  int64 downloads = 7;
  repeated string categories = 8;
  string platform = 9;
  string client_side = 10;
  string server_side = 11;
  bool installed = 12;
}

// SearchModsRequest carries the browser filters. An empty server_id is the
// Studio "none" browse mode; loader and mc_version then come from the request.
message SearchModsRequest {
  string server_id = 1;
  string query = 2;
  string platform = 3;
  string loader = 4;
  string mc_version = 5;
  string side = 6;
}

// SearchModsResponse is a page of mod search results.
message SearchModsResponse {
  repeated BrowseModResult results = 1;
  int32 count = 2;
}

// ModDependency is a dependency declared by a mod version.
message ModDependency {
  string project_id = 1;
  string version_id = 2;
  string dependency_type = 3;
  string title = 4;
}

// ModVersion is one installable version of a mod project.
message ModVersion {
  string id = 1;
  string version_number = 2;
  string name = 3;
  string version_type = 4;
  string file_name = 5;
  string download_url = 6;
  int64 file_size = 7;
  repeated ModDependency dependencies = 8;
}

// GetModVersionsRequest selects versions for one project.
message GetModVersionsRequest {
  string server_id = 1;
  string project = 2;
  string platform = 3;
  string loader = 4;
  string mc_version = 5;
}

// GetModVersionsResponse is the version list for a project.
message GetModVersionsResponse {
  repeated ModVersion versions = 1;
  int32 count = 2;
}

// InstallModEntry is one jar to download into the mods directory.
message InstallModEntry {
  string name = 1;
  string file_name = 2;
  string download_url = 3;
}

// InstallModsRequest installs a batch of mod jars on one server.
message InstallModsRequest {
  string server_id = 1;
  repeated InstallModEntry items = 2;
}

// InstallModsResponse reports per-item successes and failures.
message InstallModsResponse {
  bool success = 1;
  repeated string installed = 2;
  repeated string errors = 3;
  string message = 4;
}
