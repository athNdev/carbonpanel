syntax = "proto3";

package carbonpanel.v1;

import "carbonpanel/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// Minecraft server management
service ServerService {
  // Get all servers with optional stats
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  // Get single server details
  rpc GetServer(GetServerRequest) returns (GetServerResponse);
  // Fetch container logs
  rpc GetServerLogs(GetServerLogsRequest) returns (GetServerLogsResponse);
  // Delete container logs
  rpc ClearServerLogs(ClearServerLogsRequest) returns (ClearServerLogsResponse);
  // Find unused port
  rpc GetNextAvailablePort(GetNextAvailablePortRequest) returns (GetNextAvailablePortResponse);
  // Create new server instance
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  // Export a stopped server using its owning node storage.
  rpc ExportServerArchive(ExportServerArchiveRequest) returns (ExportServerArchiveResponse);
  // Validate a completed caller-owned upload without creating a server.
  rpc PreviewServerArchive(PreviewServerArchiveRequest) returns (PreviewServerArchiveResponse);
  // Modify server settings
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // Remove server and data
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);
  // Start server container
  rpc StartServer(StartServerRequest) returns (StartServerResponse);
  // Stop server container
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  // Stop and start container
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse);
  // Destroy and recreate container from scratch
  rpc RecreateServer(RecreateServerRequest) returns (RecreateServerResponse);
  // Execute console command
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  // Upload server logs to mclo.gs
  rpc UploadToMCLogs(UploadToMCLogsRequest) returns (UploadToMCLogsResponse);
  // Migrate server instance to a target Docker node
  rpc MigrateServer(MigrateServerRequest) returns (MigrateServerResponse);
  // Live online players from metrics collector (RCON/SLP)
  rpc ListServerPlayers(ListServerPlayersRequest) returns (ListServerPlayersResponse);
}

// Server list options
message ListServersRequest {
  bool full_stats = 1;
}

// All server instances
message ListServersResponse {
  repeated Server servers = 1;
}

// Server ID lookup
message GetServerRequest {
  string id = 1;
}

// Single server details
message GetServerResponse {
  Server server = 1;
}

// Log fetch parameters
message GetServerLogsRequest {
  string id = 1;
  int32 tail = 2;
}

// Single log line
message LogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string message = 2;
  string level = 3;
  string source = 4;
  bool is_command = 5;
  bool is_error = 6;
}

// Container log lines
message GetServerLogsResponse {
  repeated LogEntry logs = 1;
  int32 total = 2;
}

// Server to clear logs for
message ClearServerLogsRequest {
  string id = 1;
}

// Empty log clear response
message ClearServerLogsResponse {}

// Empty port request
message GetNextAvailablePortRequest {}

// Port usage entry
message UsedPort {
  int32 port = 1;
  bool in_use = 2;
}

// Available port and usage list
message GetNextAvailablePortResponse {
  int32 port = 1;
  repeated UsedPort used_ports = 2;
}

// New server configuration
message CreateServerRequest {
  string name = 1;
  string description = 2;
  ModLoader mod_loader = 3;
  string mc_version = 4;
  int32 port = 5;
  int32 max_players = 6;
  int32 memory = 7;
  string docker_image = 8;
  bool auto_start = 9;
  bool detached = 10;
  bool start_immediately = 11;
  string modpack_id = 12;
  string modpack_version_id = 13;
  string proxy_hostname = 14;
  string proxy_listener_id = 15;
  bool use_base_url = 16;
  repeated AdditionalPort additional_ports = 17;
  DockerOverrides docker_overrides = 18;
  string node_id = 19;
  string placement_strategy = 20;
  bool auto_hibernate = 21;
  bool auto_deep_sleep = 22;
  // Idempotency key for this create. Repeating it returns the original server.
  string request_id = 23;
  // Exact mod loader version. Empty means the loader's latest.
  string loader_version = 24;
  // Completed upload owned by the caller. Required request_id when importing.
  string archive_upload_id = 25;
}

// Created server instance
message CreateServerResponse {
  Server server = 1;
}

// Server fields to update
message UpdateServerRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  optional int32 port = 4;
  int32 max_players = 5;
  int32 memory = 6;
  string mod_loader = 7;
  string mc_version = 8;
  string docker_image = 9;
  optional bool auto_start = 10;
  optional bool detached = 11;
  optional string tps_command = 12;
  string modpack_id = 13;
  string modpack_version_id = 14;
  repeated AdditionalPort additional_ports = 15;
  DockerOverrides docker_overrides = 16;
  optional bool auto_hibernate = 17;
  optional int32 idle_timeout_minutes = 18;
  optional bool auto_deep_sleep = 19;
  optional int32 deep_sleep_timeout_minutes = 20;
  // Change the pinned mod loader version. Ignored when empty.
  optional string loader_version = 21;
}

// Updated server instance
message UpdateServerResponse {
  Server server = 1;
}

// Server to delete
message DeleteServerRequest {
  string id = 1;
  // Idempotency key for this delete. Repeating it does not delete twice.
  string request_id = 2;
  // keep_data removes the panel record and container but leaves the world directory in place.
  bool keep_data = 3;
  // detach leaves the container and the world directory in place and keeps the host port reserved.
  bool detach = 4;
}

// Empty deletion response
message DeleteServerResponse {}

// Server to start
message StartServerRequest {
  string id = 1;
  // Idempotency key for this start. Repeating it does not start twice.
  string request_id = 2;
}

// Start operation status
message StartServerResponse {
  string status = 1;
}

// Server to stop
message StopServerRequest {
  string id = 1;
  // Idempotency key for this stop. Repeating it does not stop twice.
  string request_id = 2;
}

// Stop operation status
message StopServerResponse {
  string status = 1;
}

// Server to restart
message RestartServerRequest {
  string id = 1;
  // Idempotency key for this restart. Repeating it does not restart twice.
  string request_id = 2;
}

// Restart operation status
message RestartServerResponse {
  string status = 1;
}

// Server to recreate
message RecreateServerRequest {
  string id = 1;
}

// Recreate operation status
message RecreateServerResponse {
  string status = 1;
}

// Console command to execute
message SendCommandRequest {
  string id = 1;
  string command = 2;
  optional bool silent = 3;
}

// Command execution result
message SendCommandResponse {
  bool success = 1;
  string output = 2;
  string error = 3;
}

// Server to upload logs for
message UploadToMCLogsRequest {
  string id = 1;
}

// mclo.gs upload result
message UploadToMCLogsResponse {
  string url = 1;
}

// Migrate server request
message MigrateServerRequest {
  string id = 1;
  string target_node_id = 2;
  optional bool force = 3;
  // Idempotency key for this migration. Repeating it does not move the world twice.
  string request_id = 4;
}

// Migrate server response
message MigrateServerResponse {
  bool success = 1;
  string message = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  int64 duration_ms = 5;
  Server server = 6;
}

// Live player list request
message ListServerPlayersRequest {
  string server_id = 1;
}

// Live player list response
message ListServerPlayersResponse {
  repeated string players = 1;
  int32 online_count = 2;
}


// ServerArchiveFormat selects the container encoding for a native server archive.
enum ServerArchiveFormat {
  SERVER_ARCHIVE_FORMAT_UNSPECIFIED = 0;
  SERVER_ARCHIVE_FORMAT_ZIP = 1;
  SERVER_ARCHIVE_FORMAT_TAR_GZ = 2;
}

// ServerArchiveConsistency declares the consistency policy used during export.
enum ServerArchiveConsistency {
  SERVER_ARCHIVE_CONSISTENCY_UNSPECIFIED = 0;
  SERVER_ARCHIVE_CONSISTENCY_STOPPED = 1;
}

// ExportServerArchiveRequest requests a consistent export of one stopped server.
message ExportServerArchiveRequest {
  string server_id = 1;
  ServerArchiveFormat format = 2;
  ServerArchiveConsistency consistency = 3;
}

// ExportServerArchiveResponse identifies the authorized download session for a prepared archive.
message ExportServerArchiveResponse {
  string session_id = 1;
  string filename = 2;
  int64 total_size = 3;
}

// PreviewServerArchiveRequest validates a caller-owned completed upload without creating a server.
message PreviewServerArchiveRequest {
  string upload_id = 1;
  string node_id = 2;
}

// ServerArchiveFindingSeverity ranks a preview finding as advisory or blocking.
enum ServerArchiveFindingSeverity {
  SERVER_ARCHIVE_FINDING_SEVERITY_UNSPECIFIED = 0;
  SERVER_ARCHIVE_FINDING_SEVERITY_WARNING = 1;
  SERVER_ARCHIVE_FINDING_SEVERITY_BLOCKER = 2;
}

// ServerArchiveFindingCode identifies the reason a preview finding was reported.
enum ServerArchiveFindingCode {
  SERVER_ARCHIVE_FINDING_CODE_UNSPECIFIED = 0;
  SERVER_ARCHIVE_FINDING_CODE_CUSTOM_RUNTIME = 1;
  SERVER_ARCHIVE_FINDING_CODE_PROVIDER_SETUP = 2;
  SERVER_ARCHIVE_FINDING_CODE_INSUFFICIENT_SPACE = 3;
  SERVER_ARCHIVE_FINDING_CODE_STORAGE_UNAVAILABLE = 4;
  SERVER_ARCHIVE_FINDING_CODE_UNSUPPORTED_LOADER = 5;
}

// ServerArchiveFinding is a typed compatibility or capacity finding from preview.
message ServerArchiveFinding {
  ServerArchiveFindingSeverity severity = 1;
  ServerArchiveFindingCode code = 2;
  string message = 3;
}

// ServerArchiveDestination is the minimal identity of an enabled node that can
// receive an archive. It deliberately omits addresses, credentials, capacity
// statistics and other node inventory so a servers/create caller does not need
// nodes/read merely to choose a destination.
message ServerArchiveDestination {
  string id = 1;
  string name = 2;
}

// PreviewServerArchiveResponse reports verified metadata, runtime defaults, capacity and findings.
message PreviewServerArchiveResponse {
  ServerArchiveFormat format = 1;
  int32 schema_version = 2;
  string exporter_version = 3;
  string mc_version = 4;
  ModLoader mod_loader = 5;
  string loader_version = 6;
  int32 memory = 7;
  int32 max_players = 8;
  int32 file_count = 9;
  int64 expanded_bytes = 10;
  int64 required_bytes = 11;
  optional int64 available_bytes = 12;
  repeated ServerArchiveFinding findings = 13;
  // Enabled destinations for this archive. Populated from the same preflight
  // used by preview so a create-only caller can pick a concrete node without
  // node inventory permission. Selecting one and previewing again runs the
  // exact-node capacity check; this list does not qualify create by itself.
  repeated ServerArchiveDestination destinations = 14;
}
