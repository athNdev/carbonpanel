syntax = "proto3";

package carbonpanel.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/athNdev/carbon-panel/pkg/proto/carbonpanel/v1;carbonpanelv1";

// WorldRef is the single tagged reference used by world viewing to identify a
// world. It intentionally never treats a folder name as an identity:
// LIBRARY_BINDING points at a World Library binding, SERVER_LOCAL resolves
// through the server's configured level name, and STATIC_IMPORT is a read-only
// historical tile snapshot.
message WorldRef {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    LIBRARY_BINDING = 1;
    SERVER_LOCAL = 2;
    STATIC_IMPORT = 3;
  }
  Kind kind = 1;
  string server_id = 2;
  string level_name = 3;
  string binding_id = 4;
  string snapshot_id = 5;
}

// Observation is the shared provenance envelope. Unknown or stale values are
// disclosed rather than replaced by a plausible-looking zero.
message Observation {
  string source = 1;
  google.protobuf.Timestamp observed_at = 2;
  string applicability = 3;
  string confidence = 4; // detected | inferred | unknown | stale | conflict
  string conflict_note = 5;
}

enum RendererType {
  RENDERER_TYPE_UNSPECIFIED = 0;
  BLUEMAP = 1;
  SQUAREMAP = 2;
  DYNMAP = 3;
  STATIC = 4;
}

enum RendererState {
  RENDERER_STATE_UNSPECIFIED = 0;
  ABSENT = 1;      // no renderer installed - onboarding
  INSTALLING = 2;  // module being created/started
  RENDERING = 3;   // initial/full render in progress
  READY = 4;       // tiles fresh and reachable
  STALE = 5;       // last-known tiles, renderer or server stopped
  STOPPED = 6;     // renderer stopped, no live overlay
  ERROR = 7;       // renderer failed/unreachable, diagnostics available
  UNSUPPORTED = 8; // renderer type has no verified adapter capability
}

// RendererDescriptor lists only capabilities verified against the renderer's
// own API/adapter. Missing capabilities are hidden or shown as unsupported in
// the console; they are never silently substituted.
message RendererDescriptor {
  RendererType type = 1;
  string version = 2;
  repeated string capabilities = 3; // map.2d, map.3d, dimensions, markers, players, time_weather, telemetry, static
  string web_base_path = 4; // same-origin reverse-proxy prefix, never an external URL
}

// WorldViewTarget is a read-only projection: it never owns world identity.
message WorldViewTarget {
  string server_id = 1;
  WorldRef world_ref = 2;
  string name = 3;
  string dimension = 4;
  RendererType renderer_type = 5;
  RendererState renderer_state = 6;
  google.protobuf.Timestamp last_render = 7;
  RendererDescriptor renderer = 8;
  Observation freshness = 9;
  string node_id = 10;
  string error = 11;
}

message MapOverlay {
  string id = 1;
  string server_id = 2;
  WorldRef world_ref = 3;
  string dimension = 4;
  string kind = 5; // marker | poi | waypoint | region
  double x = 6;
  double z = 7;
  string label = 8;
  string style = 9;
  string owner = 10;
  bool sensitive = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// The WorldViewService is observation-only. Administrative actions (teleport,
// world/region control) deliberately remain on the existing ServerService,
// ConfigService and FileService RPCs with their own authorization and audit.
service WorldViewService {
  // Global, RBAC-filtered inventory of viewable worlds.
  rpc ListWorldViewTargets(ListWorldViewTargetsRequest) returns (ListWorldViewTargetsResponse);
  // Pollable status for one world (baseline push-free freshness channel).
  rpc GetWorldViewStatus(GetWorldViewStatusRequest) returns (GetWorldViewStatusResponse);
  // Issues an opaque, short-lived, per-user session key for the same-origin
  // map proxy. No token is placed in a URL; the browser's cp_session cookie
  // authenticates each proxied asset request.
  rpc GetWorldViewSession(GetWorldViewSessionRequest) returns (GetWorldViewSessionResponse);
  // Capability matrix for the selected renderer, used to gate visible controls.
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc ListMapOverlays(ListMapOverlaysRequest) returns (ListMapOverlaysResponse);
  rpc SetMapOverlay(SetMapOverlayRequest) returns (SetMapOverlayResponse);
  // Opt-in, audited disclosure of sensitive player locations.
  rpc SetPlayerVisibility(SetPlayerVisibilityRequest) returns (SetPlayerVisibilityResponse);
}

message ListWorldViewTargetsRequest {}

message ListWorldViewTargetsResponse {
  repeated WorldViewTarget targets = 1;
}

message GetWorldViewStatusRequest {
  string server_id = 1;
  WorldRef world_ref = 2;
}

message GetWorldViewStatusResponse {
  WorldViewTarget target = 1;
}

message GetWorldViewSessionRequest {
  string server_id = 1;
  WorldRef world_ref = 2;
}

message GetWorldViewSessionResponse {
  // Same-origin path prefix; append the renderer asset path. Empty when the
  // renderer is unavailable or the caller lacks world_view/read.
  string proxy_path = 1;
  google.protobuf.Timestamp expires_at = 2;
  RendererState state = 3;
  string reason = 4;
}

message ListCapabilitiesRequest {
  string server_id = 1;
}

message Capability {
  string name = 1;
  bool supported = 2;
  string detail = 3;
}

message ListCapabilitiesResponse {
  RendererType renderer_type = 1;
  repeated Capability capabilities = 2;
}

message ListMapOverlaysRequest {
  string server_id = 1;
  WorldRef world_ref = 2;
  string dimension = 3;
}

message ListMapOverlaysResponse {
  repeated MapOverlay overlays = 1;
}

message SetMapOverlayRequest {
  string server_id = 1;
  MapOverlay overlay = 2;
}

message SetMapOverlayResponse {
  MapOverlay overlay = 1;
}

message SetPlayerVisibilityRequest {
  string server_id = 1;
  WorldRef world_ref = 2;
  bool visible = 3;
}

message SetPlayerVisibilityResponse {
  bool visible = 1;
  Observation observation = 2;
}
