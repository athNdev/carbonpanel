# SPDX-License-Identifier: MPL-2.0
name: Toolchain policy
on:
  pull_request:
    paths:
      - 'toolchain-versions.json'
      - 'go.mod'
      - 'Makefile'
      - 'docker/Dockerfile.*'
      - 'scripts/proto-generate.mjs'
      - 'scripts/check-toolchain-policy*'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'toolchain-versions.json'
      - 'go.mod'
      - 'Makefile'
      - 'docker/Dockerfile.*'
      - 'scripts/proto-generate.mjs'
      - 'scripts/check-toolchain-policy*'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun scripts/check-toolchain-policy.mjs
      - run: bun test scripts/check-toolchain-policy.test.mjs
