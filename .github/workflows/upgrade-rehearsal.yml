# SPDX-License-Identifier: MPL-2.0
# Recurring, DISPOSABLE real-binary upgrade rehearsal (OSS-406).
# Build-only and read-only: downloads the verified v1.0.40 stable archive,
# builds a candidate from this checkout, and runs both real binaries against
# seeded disposable DB/world copies. No registry, release, tag, host or live
# world is read or written. Every write stays under $RUNNER_TEMP.
name: Upgrade rehearsal

on:
  # Recurring: weekly on Monday at 06:17 UTC.
  schedule:
    - cron: '17 6 * * 1'
  # Normal PR gate, path-scoped to the surfaces that can change upgrade behavior.
  pull_request:
    paths:
      - '.github/workflows/upgrade-rehearsal.yml'
      - 'scripts/upgrade_rehearsal_ci.py'
      - 'scripts/test_upgrade_rehearsal_ci.py'
      - 'scripts/rehearse_upgrade.py'
      - 'scripts/node_vm_upgrade.py'
      - 'scripts/compose-upgrade.sh'
      - 'scripts/compose-upgrade-rollback.sh'
      - 'scripts/release.py'
      - 'internal/db/**'
      - 'internal/storage/**'
      - 'internal/config/**'
      - 'cmd/carbon-panel/**'
      - 'config.example.yaml'
      - 'docs/releases.md'
      - 'docs/release-history.md'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: upgrade-rehearsal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Disposable v1.0.40 → candidate upgrade rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # go:embed of the console requires the directory to exist on a fresh
      # checkout; this matches the backend jobs in ci.yml.
      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: Run offline helper fail-closed tests
        run: python3 -m unittest scripts.test_upgrade_rehearsal_ci

      - name: Run real-binary disposable rehearsal
        env:
          WORKSPACE: ${{ runner.temp }}/upgrade-rehearsal
          CANDIDATE_VERSION: 2.0.0-verify.ci
        run: |
          python3 scripts/upgrade_rehearsal_ci.py \
            --workspace "$WORKSPACE" \
            --target-os linux --target-arch amd64 \
            --stable-version v1.0.40 \
            --stable-commit f88748be6a216b187e675bbb1f110df07e544148 \
            --candidate-version "$CANDIDATE_VERSION" \
            --candidate-commit "$(git rev-parse HEAD)" \
            --go-binary go

      - name: Print evidence summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/upgrade-rehearsal/rehearsal-ci-report.json" ]; then
            python3 - "$RUNNER_TEMP/upgrade-rehearsal/rehearsal-ci-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("upgrade rehearsal pass:", report["pass"])
          print("stable:", report["stable"]["archive"], report["stable"]["archive_sha256"])
          print("candidate:", report["candidate"]["version"], report["candidate"]["commit"],
                report["candidate"]["binary_sha256"])
          print("failed checks:", report["failed_checks"])
          print("world files hashed:", report["world_files_hashed"])
          PY
          fi

      - name: Upload disposable evidence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-rehearsal/rehearsal-ci-report.json
          if-no-files-found: error
          retention-days: 14
