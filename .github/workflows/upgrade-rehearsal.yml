# SPDX-License-Identifier: MPL-2.0
# Recurring, DISPOSABLE real-binary upgrade rehearsal (OSS-406).
# Build-only and read-only: downloads the verified v1.0.40 LEGACY baseline and
# the current published stable derived from the product version contract,
# builds a candidate from this checkout, and runs the real binaries against
# seeded disposable DB/world copies in two cases. No registry, release, tag,
# host or live world is read or written; all disposable artifacts stay under
# $RUNNER_TEMP (toolchain build caches excepted).
name: Upgrade rehearsal

on:
  # Recurring: weekly on Monday at 06:17 UTC.
  schedule:
    - cron: '17 6 * * 1'
  # Normal PR gate, path-scoped to the surfaces that can change upgrade behavior.
  pull_request:
    paths:
      - '.github/workflows/upgrade-rehearsal.yml'
      - 'scripts/upgrade_rehearsal_ci.py'
      - 'scripts/test_upgrade_rehearsal_ci.py'
      - 'scripts/rehearse_upgrade.py'
      - 'scripts/node_vm_upgrade.py'
      - 'scripts/compose-upgrade.sh'
      - 'scripts/compose-upgrade-rollback.sh'
      - 'scripts/release.py'
      - 'internal/db/**'
      - 'internal/storage/**'
      - 'internal/config/**'
      - 'cmd/carbon-panel/**'
      - 'config.example.yaml'
      - 'docs/releases.md'
      - 'docs/release-history.md'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: carbonpanel-stage-rehearsal-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Disposable v1.0.40 → candidate upgrade rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job builds PR-contributed code and runs a downloaded binary.
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # go:embed of the console requires the directory to exist on a fresh
      # checkout; this matches the backend jobs in ci.yml.
      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: Run offline helper fail-closed tests
        run: python3 -m unittest scripts.test_upgrade_rehearsal_ci

      - name: Run real-binary disposable rehearsal (legacy + derived current stable)
        env:
          WORKSPACE: ${{ runner.temp }}/upgrade-rehearsal
          CANDIDATE_VERSION: 2.0.0-verify.ci
          # Read-only token used only to derive the current stable from the
          # authoritative GitHub release record via the product version contract.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/upgrade_rehearsal_ci.py \
            --workspace "$WORKSPACE" \
            --target-os linux --target-arch amd64 \
            --candidate-version "$CANDIDATE_VERSION" \
            --candidate-commit "$(git rev-parse HEAD)" \
            --go-binary go

      - name: Print evidence summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/upgrade-rehearsal/rehearsal-ci-report.json" ]; then
            python3 - "$RUNNER_TEMP/upgrade-rehearsal/rehearsal-ci-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("upgrade rehearsal pass:", report.get("pass"))
          # A fail-closed run can stop before the candidate or cases are recorded;
          # still surface the original error instead of crashing the summary.
          if report.get("error"):
              print("error:", report["error"])
          for case in ("legacy", "current"):
              meta = report.get("stable_" + case) or {}
              if meta:
                  print(case + " stable:", meta.get("release_tag"), meta.get("archive_sha256"),
                        "source:", meta.get("source"))
          candidate = report.get("candidate") or {}
          if candidate:
              print("candidate:", candidate.get("version"), candidate.get("commit"),
                    candidate.get("binary_sha256"))
          else:
              print("candidate: unavailable (run stopped before the candidate was recorded)")
          print("failed checks:", report.get("failed_checks") or [])
          for name, detail in (report.get("cases") or {}).items():
              print(name, "tables:", detail.get("stable_tables"), "->", detail.get("candidate_tables"))
          PY
          fi

      - name: Upload disposable evidence report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-rehearsal/rehearsal-ci-report.json
          if-no-files-found: error
          retention-days: 14
