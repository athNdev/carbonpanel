name: Continuous Integration

on:
  push:
    branches:
      - main
  # No branch filter: stacked PRs target working branches (codex/*, arch/*),
  # not only main, and they still need CI. Filtering to main meant those PRs
  # ran no checks at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release tooling contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest scripts.test_release scripts.test_docs_publication_gate scripts.test_go_mod_download scripts.test_runtime_artifacts
      - run: python3 -m unittest scripts.test_validate_mcp_server_json
      # Offline only: this PR test never authenticates or writes Docker Hub.
      - run: python3 -m unittest scripts.test_dockerhub_description scripts.test_version_bump_channels scripts.test_dockerhub_publication_guard

  proxmox-installer:
    name: Proxmox installer fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run installer fixtures (stub Docker; no live Proxmox)
        run: bash scripts/proxmox/test-install-carbon-panel.sh

  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      # Runs the full suite (`go test ./...`), same as `make test`, so CI,
      # Makefile and local dev all agree on what "the test suite" means.
      - name: Run Backend Test Suite
        run: make test

  # OSS-406: the STRICT MCP full-coverage gate and the real-binary stdio
  # conformance harness are ordinary CI, not only the dispatch-only MCP
  # publication lane. Deliberately NOT path-gated: a newly unmounted supported
  # operation must make CI RED for every change, so there is no skip path.
  mcp-coverage:
    name: MCP Full Coverage & stdio Conformance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod' # pinned to Go 1.26.11 by the repository
          cache: true

      # Reused verbatim from the publication lane. No continue-on-error: the
      # gate (and its fail-closed negative fixture) must fail this job.
      - name: STRICT MCP full-coverage gate (fail-closed)
        run: bash scripts/mcp-full-coverage-gate.sh

      - name: Assert generated MCP artifacts are byte-reproducible
        run: bash scripts/mcp-generated-artifacts-check.sh

      - name: Build the real MCP stdio binary
        run: go build -o "$RUNNER_TEMP/carbonpanel-mcp" ./cmd/carbonpanel-mcp

      # Reuses the existing harness: PUBLIC tools/list + a read-only
      # tools/call against the compiled cmd/carbonpanel-mcp over real stdio,
      # with a disposable owned Connect mock (no live panel or real credential).
      - name: stdio conformance against cmd/carbonpanel-mcp
        run: python3 scripts/test_mcp_real_binary.py --binary "$RUNNER_TEMP/carbonpanel-mcp" --evidence validation/mcp/mcp-real-binary-smoke.json

  test-windows-compile:
    name: Windows Compile Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Compile every Go package, including OS-specific files, without
      # attempting to execute the Windows test binaries on Linux.
      - name: Compile Windows packages
        run: go test -run '^$' -exec /bin/true ./...
        env:
          GOOS: windows
          CGO_ENABLED: '0'

  test-windows-files:
    name: Windows Runtime Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Exercise native disk and TCP/UDP fixture behavior, not just cross-compiled
      # objects. Listener guards reject public binds before they reach Windows.
      - name: Run Windows files and listener tests
        run: go test -count=1 ./pkg/files ./internal/config ./internal/proxy ./internal/module

  lint-backend:
    name: Backend Lint & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: go vet
        run: go vet ./...

      # Gate changed lines while publishing the complete compatible-toolchain
      # report below. Historical debt is visible without blocking unrelated work.
      #
      # Do not use the action's only-new-issues for pull requests: it fetches
      # the PR diff through the GitHub API, which rejects diffs over 20,000
      # lines before lint runs. Compare against the exact PR base commit
      # instead; the checkout above has full history (fetch-depth: 0).
      - name: golangci-lint (changed lines vs pull request base)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          only-new-issues: 'false'
          args: --new-from-rev=${{ github.event.pull_request.base.sha }}

      # A push has no pull_request base. github.event.before is the previous
      # tip of main, so gate only commits introduced by this push.
      - name: golangci-lint (changed lines since previous main commit)
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          only-new-issues: 'false'
          args: --new-from-rev=${{ github.event.before }}

      # New branches, tags and non-push/non-PR events have no usable base
      # commit. Preserve the current behavior instead of passing an empty or
      # all-zero revision to --new-from-rev.
      - name: golangci-lint (changed lines only, no usable base)
        if: github.event_name != 'pull_request' && (github.event.before == '' || github.event.before == '0000000000000000000000000000000000000000')
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          only-new-issues: 'true'

      - name: Record full lint debt
        if: always()
        run: |
          mkdir -p validation/lint
          git rev-parse HEAD > validation/lint/revision.txt
          go version > validation/lint/toolchain.txt
          golangci-lint version > validation/lint/linter.txt
          status=0
          golangci-lint run --output.json.path=validation/lint/findings.json --output.text.path=validation/lint/findings.txt ./... || status=$?
          printf '%s\n' "$status" > validation/lint/exit-code.txt
          python3 -m unittest scripts.test_check_lint_report
          python3 scripts/check_lint_report.py validation/lint/findings.json "$status"

      - name: Upload full lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-lint-${{ github.sha }}
          path: validation/lint/
          if-no-files-found: error

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # The JSON scanner exits zero even when it reports findings. Require a
      # successful complete scan, then block reachable findings with a fix.
      # Unfixed reachable findings remain visible and non-blocking.
      - name: Run govulncheck
        run: |
          mkdir -p validation/vuln
          status=0
          go run ./cmd/govulncheck-policy -output validation/vuln/govulncheck.json > validation/vuln/policy.json || status=$?
          cat validation/vuln/policy.json
          exit "$status"

      - name: Upload vulnerability scan and policy result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-${{ github.sha }}
          path: validation/vuln/
          if-no-files-found: warn

  # Race detector over concurrency-heavy OSS packages (MINE-146, MINE-149).
  # internal/rpc/... is included because the async remote-download/extraction
  # progress trackers live there and raced undetected until MINE-149.
  test-race:
    name: Go Race Detector
    runs-on: ubuntu-latest
    # internal/rpc/services takes ~513s under -race, close to Go's 10m default
    # per-binary timeout. Keep every package and test, raise only the package
    # timeout, and bound the overall job.
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: Fetch dependencies with bounded transport retries
        timeout-minutes: 10
        run: python3 scripts/go_mod_download.py

      - name: Run race detector
        run: go test -race -timeout 20m -count=1 ./internal/rpc/... ./internal/auth/ ./internal/reconciler/ ./internal/scheduler/ ./internal/docker/ ./internal/activity/ ./internal/metrics/ ./internal/proxy/ ./internal/db/ ./internal/ws/ ./internal/s3/ ./internal/snapshot/ ./internal/module/

  lint-proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

  proto-breaking:
    name: Proto Breaking Change Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for Buf
        run: git fetch origin main

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf breaking
        run: buf breaking --against '.git#branch=origin/main'

  test-frontend:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/carbon-panel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: SvelteKit Type & Component Diagnostics
        run: bun run check

      - name: Unit Tests
        run: bun run test

      - name: Lint (Prettier & ESLint)
        run: bun run lint

      - name: Production Vite Build
        run: bun run build

  # Real-Chromium keyboard/accessibility journeys: the shared component fixture
  # and real application routes served from the production static build (the
  # assets the Go binary embeds) with RPCs seeded at the network boundary. Kept
  # as its own job so the ordinary unit/build gate above stays fast; this job
  # uses the repository's existing owned review-browser harness and an owned
  # runner-temp browser cache (no global install or GC).
  test-frontend-a11y:
    name: Frontend Accessibility Journey (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure private browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/carbonpanel-a11y-browsers" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install frontend dependencies
        working-directory: web/carbon-panel
        run: bun install --frozen-lockfile

      # The route journey drives the packaged bundle, not a dev server. Build
      # the real SvelteKit output before launching the loopback static server.
      - name: Production frontend build for packaged routes
        working-directory: web/carbon-panel
        run: bun run build

      - name: Install browser harness
        working-directory: scripts/manual-review/e2e
        run: bun install --frozen-lockfile

      - name: Install Chromium into the owned cache
        working-directory: scripts/manual-review/e2e
        run: bunx playwright install --with-deps chromium

      - name: Exercise component and packaged-route accessibility in Chromium
        working-directory: scripts/manual-review/e2e
        run: node a11y-check.mjs

      - name: Native terrain viewport and packaged World View (Chromium)
        working-directory: scripts/manual-review/e2e
        run: node native-map-viewport-check.mjs

      - name: World View scope and session recovery (Chromium)
        working-directory: scripts/manual-review/e2e
        run: node worldview-scoped-denial-check.mjs

      - name: Local administrator OIDC linking (Chromium)
        working-directory: web/carbon-panel
        run: node e2e/oidc-admin-linking.mjs

      # OSS-245/OSS-185 named diagnostics fixture: stale console responses,
      # AUTH_FAIL sign-out, non-idempotent requests and recreated subscriptions.
      - name: Diagnostics reconnect fixture (Chromium)
        working-directory: web/carbon-panel
        env:
          OSS245_LIVE_BROWSER: '1'
        run: bun test --conditions=browser e2e/oss-245-diagnostics-reconnect.spec.ts

  # Optional cross-engine smoke: the same packaged routes (dashboard, players,
  # world library) under both themes at 1440/360, driven in Firefox and WebKit
  # with the locked review driver and an owned runner-temp browser cache. This
  # is a smoke check, not a claim of full cross-engine coverage.
  test-frontend-a11y-cross-engine:
    name: Frontend Route Accessibility Smoke (Firefox/WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure private browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/carbonpanel-a11y-browsers" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install frontend dependencies
        working-directory: web/carbon-panel
        run: bun install --frozen-lockfile

      - name: Production frontend build for packaged routes
        working-directory: web/carbon-panel
        run: bun run build

      - name: Install browser harness
        working-directory: scripts/manual-review/e2e
        run: bun install --frozen-lockfile

      - name: Install Firefox and WebKit into the owned cache
        working-directory: scripts/manual-review/e2e
        run: bunx playwright install --with-deps firefox webkit

      - name: Smoke packaged routes in Firefox
        working-directory: scripts/manual-review/e2e
        run: node a11y-check.mjs --engine=firefox

      - name: Smoke packaged routes in WebKit
        working-directory: scripts/manual-review/e2e
        run: node a11y-check.mjs --engine=webkit

  test-landing:
    name: Landing Page Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check landing page and brand assets
        run: |
          python3 -m unittest scripts.test_landing_page scripts.test_design_system_page
          python3 scripts/check_brand_assets.py

  knowledge:
    name: Knowledge Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Test knowledge linter
        run: go test ./cmd/knowledge-lint

      - name: Lint knowledge base
        run: go run ./cmd/knowledge-lint -root .

      # OSS-24: reproducible stdio capability matrix for the pinned MCP
      # servers. This proves the protocol surface only; Zed-editor end-to-end
      # use remains an interactive, human-owned verification step.
      - name: MCP stdio capability smoke
        run: node scripts/mcp-smoke.mjs
