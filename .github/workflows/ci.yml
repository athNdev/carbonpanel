name: Continuous Integration

on:
  push:
    branches:
      - main
  # No branch filter: stacked PRs target working branches (codex/*, arch/*),
  # not only main, and they still need CI. Filtering to main meant those PRs
  # ran no checks at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release tooling contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest scripts.test_release scripts.test_go_mod_download

  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      # Runs the full suite (`go test ./...`), same as `make test`, so CI,
      # Makefile and local dev all agree on what "the test suite" means.
      - name: Run Backend Test Suite
        run: make test

  test-windows-compile:
    name: Windows Compile Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Compile every Go package, including OS-specific files, without
      # attempting to execute the Windows test binaries on Linux.
      - name: Compile Windows packages
        run: go test -run '^$' -exec /bin/true ./...
        env:
          GOOS: windows
          CGO_ENABLED: '0'

  test-windows-files:
    name: Windows Runtime Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Exercise native disk and TCP/UDP fixture behavior, not just cross-compiled
      # objects. Listener guards reject public binds before they reach Windows.
      - name: Run Windows files and listener tests
        run: go test -count=1 ./pkg/files ./internal/config ./internal/proxy ./internal/module

  lint-backend:
    name: Backend Lint & Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: go vet
        run: go vet ./...

      # Gate changed lines while publishing the complete compatible-toolchain
      # report below. Historical debt is visible without blocking unrelated work.
      - name: golangci-lint (new/changed code only)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          only-new-issues: true

      - name: Record full lint debt
        if: always()
        run: |
          mkdir -p validation/lint
          git rev-parse HEAD > validation/lint/revision.txt
          go version > validation/lint/toolchain.txt
          golangci-lint version > validation/lint/linter.txt
          status=0
          golangci-lint run --output.json.path=validation/lint/findings.json --output.text.path=validation/lint/findings.txt ./... || status=$?
          printf '%s\n' "$status" > validation/lint/exit-code.txt
          python3 -m unittest scripts.test_check_lint_report
          python3 scripts/check_lint_report.py validation/lint/findings.json "$status"

      - name: Upload full lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-lint-${{ github.sha }}
          path: validation/lint/
          if-no-files-found: error

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # The JSON scanner exits zero even when it reports findings. Require a
      # successful complete scan, then block reachable findings with a fix.
      # Unfixed reachable findings remain visible and non-blocking.
      - name: Run govulncheck
        run: |
          mkdir -p validation/vuln
          status=0
          go run ./cmd/govulncheck-policy -output validation/vuln/govulncheck.json > validation/vuln/policy.json || status=$?
          cat validation/vuln/policy.json
          exit "$status"

      - name: Upload vulnerability scan and policy result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: govulncheck-${{ github.sha }}
          path: validation/vuln/
          if-no-files-found: warn

  # Race detector over concurrency-heavy OSS packages (MINE-146, MINE-149).
  # internal/rpc/... is included because the async remote-download/extraction
  # progress trackers live there and raced undetected until MINE-149.
  test-race:
    name: Go Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure embedded web build directory exists
        run: mkdir -p web/carbon-panel/build && touch web/carbon-panel/build/.gitkeep

      - name: Fetch dependencies with bounded transport retries
        timeout-minutes: 10
        run: python3 scripts/go_mod_download.py

      - name: Run race detector
        run: go test -race -count=1 ./internal/rpc/... ./internal/reconciler/ ./internal/scheduler/ ./internal/docker/ ./internal/activity/ ./internal/metrics/ ./internal/proxy/ ./internal/db/ ./internal/ws/ ./internal/s3/ ./internal/snapshot/ ./internal/module/

  lint-proto:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf lint
        run: buf lint

  proto-breaking:
    name: Proto Breaking Change Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch for Buf
        run: git fetch origin main

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf breaking
        run: buf breaking --against '.git#branch=origin/main'

  test-frontend:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/carbon-panel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: SvelteKit Type & Component Diagnostics
        run: bun run check

      - name: Unit Tests
        run: bun run test

      - name: Lint (Prettier & ESLint)
        run: bun run lint

      - name: Production Vite Build
        run: bun run build

  test-landing:
    name: Landing Page Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check landing page and brand assets
        run: |
          python3 -m unittest scripts.test_landing_page scripts.test_design_system_page
          python3 scripts/check_brand_assets.py

  knowledge:
    name: Knowledge Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Test knowledge linter
        run: go test ./cmd/knowledge-lint

      - name: Lint knowledge base
        run: go run ./cmd/knowledge-lint -root .
