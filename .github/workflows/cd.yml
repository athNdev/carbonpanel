name: Docker Hub CD

on:
  pull_request:
    paths:
      - '.github/workflows/cd.yml'
      - 'scripts/nightly_recovery.py'
      - 'scripts/test_nightly_recovery.py'
      - 'scripts/docs_publication_gate.py'
      - 'scripts/release.py'
  # An ordinary verified main merge only builds and verifies; it does NOT push
  # :edge, :sha or :nightly images. Developer-channel publication requires an
  # explicit workflow_dispatch with push=true or nightly=true, gated in
  # scripts/release.py. The shared sha-<commit> tag is preflighted before any
  # build/push and reused when already verified. The workflow is not disabled:
  # CI-completed events still build with push=false (DESIGN.md section 10.1 #6).
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
  # Native Actions cadence only. This is a NIGHTLY-ONLY development alias
  # publisher: it resolves and pins the current main tip, verifies exact-commit
  # main CI, and reuses the verified sha-<commit> image. It never writes latest,
  # a stable minor tag, edge, a release record or any MCP/runtime/module image.
  # A schedule VERIFIES BY DEFAULT: the write is separately gated by the
  # default-off repository variable NIGHTLY_SCHEDULE_PUBLISH (see releases.md).
  # 18:00 UTC is 04:00 AEST / 05:00 AEDT, ahead of the 06:30 Sydney local updater.
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
  # The second cron is the OSS-413 reconciliation run: it re-verifies and, with
  # CHANNEL_RECONCILE_PUBLISH=true, repairs rolling/nightly drift on BOTH
  # registries. It is verify-only by default. Version tags are owned by
  # release.yml; main builds are development images.
  workflow_dispatch:
    inputs:
      push:
        description: 'EXPLICIT developer-channel opt-in: publish edge/sha images to Docker Hub (off = build and verify only)'
        required: true
        type: boolean
        default: false
      nightly:
        description: 'EXPLICIT nightly opt-in: publish the verified sha-<commit> image and move only the nightly alias (off = build and verify only)'
        required: true
        type: boolean
        default: false
      previous_nightly_commit:
        description: 'Optional verified commit currently held by nightly; required only when moving over a different digest'
        required: false
        type: string
        default: ''
      previous_nightly_digest:
        description: 'Observed digest currently held by nightly; must match the live alias and its verified sha reference'
        required: false
        type: string
        default: ''
      previous_edge_commit:
        description: 'Verified commit currently held by edge; separate from the nightly binding'
        required: false
        type: string
        default: ''
      previous_edge_digest:
        description: 'Observed digest currently held by edge; must match the live alias and its verified sha reference'
        required: false
        type: string
        default: ''
      expected_sha_digest:
        description: 'Verified digest for the pinned commit sha tag; required only when reusing an existing sha image'
        required: false
        type: string
        default: ''
      pinned_evidence:
        description: 'Trusted pinned build evidence JSON, e.g. {"digest":"sha256:..."}; optional corroboration for sha reuse'
        required: false
        type: string
        default: ''
      recovery:
        description: 'OSS-413 split Nightly recovery phase (see docs/nightly-recovery.md)'
        type: choice
        default: 'off'
        options: ['off', prepare, stage, hub, docs, commit, restore-hub, restore-docs, inspect]
      recovery_evidence:
        description: 'Prepare config JSON, or reviewed plan binding {"run":"…","digest":"sha256:…"}'
        type: string

# Least privilege at the workflow level; publication is gated by the opt-in.
permissions:
  contents: read
  actions: read

jobs:
  build-and-push:
    name: Build & Push Docker Hub Image
    runs-on: ubuntu-latest
    # Manual dispatches always run. A workflow_run event only
    # runs for a push-triggered CI run (i.e. main) that succeeded - PR CI runs
    # and failed runs never publish.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.recovery == 'off') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    # Job-level concurrency is applied only after this job's if condition.
    # Verification runs share a cancellable group; an opted-in publication uses
    # a separate group that routine main builds cannot cancel mid-write.
    concurrency:
      # Publication is serialized channel-wide, with no SHA, so edge, nightly
      # and shared sha-<commit> writes from different commits cannot race. An
      # enabled scheduled nightly joins the SAME fixed group, giving a
      # single-writer proof against manual publishes. It never cancels an
      # in-flight write. Verification stays per-SHA cancellable; a schedule
      # with the default-off setting unset is verification-only.
      group: ${{ ((github.event_name == 'workflow_dispatch' && (inputs.push || inputs.nightly)) || (github.event_name == 'schedule' && vars.NIGHTLY_SCHEDULE_PUBLISH == 'true')) && 'cd-publish-edge' || format('cd-verify-{0}', github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha) }}
      cancel-in-progress: ${{ !((github.event_name == 'workflow_dispatch' && (inputs.push || inputs.nightly)) || (github.event_name == 'schedule' && vars.NIGHTLY_SCHEDULE_PUBLISH == 'true')) }}

    steps:
      - name: Refuse manual Nightly while split recovery is active
        if: github.event_name == 'workflow_dispatch' && inputs.nightly && vars.NIGHTLY_RECOVERY_ACTIVE == 'true'
        run: |
          echo "::error::Finish or compensate the active Nightly recovery before republishing"
          exit 1
      - name: Resolve the pinned verified commit
        id: pinned
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # Never trust the schedule event SHA. Read the CURRENT main tip
            # twice; a moving or unavailable tip pins nothing and is skipped.
            first=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            second=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            if [ -z "$first" ] || [ "$first" != "$second" ]; then
              echo "stable=false" >> "$GITHUB_OUTPUT"
              echo "::warning::main tip could not be pinned; scheduled nightly is skipped"
              exit 0
            fi
            echo "sha=$first" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${RUN_SHA:-$EVENT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never check out a moving branch tip: the tree must match the SHA
          # verified by CI and used for tags, labels and provenance. An unpinned
          # schedule falls back to the event SHA for verification only.
          ref: ${{ steps.pinned.outputs.sha || github.sha }}
          # Ancestry verification needs main's history for merge-base.
          fetch-depth: 0

      - name: Assert checked-out HEAD equals the pinned commit
        if: steps.pinned.outputs.sha != ''
        env:
          EXPECTED_SHA: ${{ steps.pinned.outputs.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out HEAD $actual differs from verified commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify exact main CI for the dispatch or schedule commit
        id: ci
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ steps.pinned.outputs.sha }}
        run: python3 scripts/release.py verify-main-ci --commit "$CI_COMMIT"
      - name: Decide developer-channel publication (explicit opt-in only)
        id: channel
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_OPT_IN: ${{ inputs.push }}
          CHANNEL_RUN_EVENT: ${{ github.event.workflow_run.event }}
          CHANNEL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          python3 scripts/release.py developer-channel-gate \
            --event "$CHANNEL_EVENT" --opt-in "$CHANNEL_OPT_IN" \
            --run-event "$CHANNEL_RUN_EVENT" --conclusion "$CHANNEL_CONCLUSION" \
            --ref "$CHANNEL_REF" --ci-verified "$CHANNEL_CI_VERIFIED"
      - name: Decide nightly publication (explicit opt-in or trusted schedule)
        id: nightly
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_OPT_IN: ${{ inputs.nightly }}
          CHANNEL_RUN_EVENT: ${{ github.event.workflow_run.event }}
          CHANNEL_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
          PINNED_COMMIT: ${{ steps.pinned.outputs.sha }}
          MAIN_PIN_STABLE: ${{ steps.pinned.outputs.stable }}
          NIGHTLY_SCHEDULE_PUBLISH: ${{ vars.NIGHTLY_RECOVERY_ACTIVE != 'true' && vars.NIGHTLY_SCHEDULE_PUBLISH || 'false' }}
        run: |
          if [ "$CHANNEL_EVENT" = "schedule" ]; then
            python3 scripts/release.py nightly-schedule-gate \
              --event "$CHANNEL_EVENT" --commit "$PINNED_COMMIT" \
              --ref "$CHANNEL_REF" --ci-verified "$CHANNEL_CI_VERIFIED" \
              --pin-stable "$MAIN_PIN_STABLE" \
              --operator-setting "$NIGHTLY_SCHEDULE_PUBLISH"
          else
            python3 scripts/release.py nightly-gate \
              --event "$CHANNEL_EVENT" --opt-in "$CHANNEL_OPT_IN" \
              --run-event "$CHANNEL_RUN_EVENT" --conclusion "$CHANNEL_CONCLUSION" \
              --ref "$CHANNEL_REF" --ci-verified "$CHANNEL_CI_VERIFIED" \
              --commit "$PINNED_COMMIT"
          fi

      - name: Preflight shared sha tag identity before any build or push
        id: sha_gate
        if: steps.channel.outputs.publish == 'true' || steps.nightly.outputs.publish == 'true'
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          PINNED_COMMIT: ${{ steps.pinned.outputs.sha }}
          EXPECTED_DIGEST: ${{ inputs.expected_sha_digest }}
          CI_VERIFIED: ${{ steps.ci.outputs.verified }}
          PINNED_EVIDENCE: ${{ inputs.pinned_evidence }}
        # Reuse a verified existing sha image only with trusted pinned evidence;
        # conflict, unknown lookup or missing digest fails here with zero writes.
        # The schedule branch reuses a verified tag or SKIPS a present-but-
        # unverified/unknown one without any registry write.
        run: |
          if [ "$CHANNEL_EVENT" = "schedule" ]; then
            python3 scripts/release.py nightly-schedule-sha-gate \
              --commit "$PINNED_COMMIT" --ci-verified "$CI_VERIFIED"
          else
            python3 scripts/release.py sha-tag-gate \
              --commit "$PINNED_COMMIT" --expected-digest "$EXPECTED_DIGEST" \
              --ci-verified "$CI_VERIFIED" --pinned-evidence "$PINNED_EVIDENCE"
          fi

      - name: Docker Hub Credentials & Login Check
        id: check-creds
        if: steps.channel.outputs.publish == 'true' || steps.nightly.outputs.publish == 'true'
        env:
          RAW_USER: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          RAW_PASS: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$RAW_USER" ] || [ -z "$RAW_PASS" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub credentials not configured (secrets.DOCKER_HUB_USERNAME and secrets.DOCKER_HUB_PASSWORD). Docker images will be built and verified without pushing."
            exit 0
          fi

          # Strip whitespace, newlines, carriage returns, leading/trailing quotes
          USER_CLEAN=$(printf '%s' "$RAW_USER" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\''"]*//' -e 's/[[:space:]"'\''"]*$//')
          PASS_CLEAN=$(printf '%s' "$RAW_PASS" | tr -d '\r\n' | sed -e 's/^[[:space:]"'\''"]*//' -e 's/[[:space:]"'\''"]*$//')

          # Safe non-sensitive diagnostics
          echo "Username character count: ${#USER_CLEAN}"
          echo "Password character count: ${#PASS_CLEAN}"
          if [[ "$USER_CLEAN" =~ @ ]]; then
            echo "::error::DOCKER_HUB_USERNAME appears to be an email address. Docker Hub requires your personal Docker ID (username), not email!"
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "$PASS_CLEAN" == *" "* ]]; then
            echo "::warning::DOCKER_HUB_PASSWORD contains spaces. A Docker PAT should not contain spaces."
          fi
          if [[ "$PASS_CLEAN" =~ ^dckr_pat_ ]]; then
            echo "Token format matches Docker Personal Access Token (starts with 'dckr_pat_')."
          fi

          # Mask cleaned credentials in logs
          echo "::add-mask::$PASS_CLEAN"
          echo "::add-mask::$USER_CLEAN"

          # Direct Docker Hub API verification
          echo "Checking Docker Hub API authentication directly..."
          AUTH_RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "Content-Type: application/json" \
            -X POST -d "{\"username\": \"$USER_CLEAN\", \"password\": \"$PASS_CLEAN\"}" \
            https://hub.docker.com/v2/users/login/)
          HTTP_CODE=$(echo "$AUTH_RESP" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$AUTH_RESP" | grep -v "HTTP_STATUS")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Docker Hub API token validation: SUCCESS (HTTP 200)"
          else
            echo "::error::Docker Hub API returned HTTP $HTTP_CODE: $BODY"
          fi

          # Reset docker config to ensure clean state
          rm -f ~/.docker/config.json
          docker logout || true

          # Authenticate via password-stdin
          echo "Authenticating Docker CLI..."
          if printf '%s' "$PASS_CLEAN" | docker login -u "$USER_CLEAN" --password-stdin; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "login_ok=true" >> "$GITHUB_OUTPUT"
            echo "Docker CLI login succeeded."

            # Fail fast if this account cannot push. A login can succeed
            # while the push is later denied (insufficient_scope), which
            # otherwise only shows up after the full multi-arch build.
            echo "Checking push permission on atharvnaphade/carbonpanel..."
            TOKEN=$(curl -s -u "$USER_CLEAN:$PASS_CLEAN" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:atharvnaphade/carbonpanel:push,pull" \
              | jq -r '.token // empty')
            PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
            ACTIONS=$(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null \
              | jq -r '[.access[]? | select(.name == "atharvnaphade/carbonpanel") | .actions[]] | join(",")' 2>/dev/null || true)
            echo "Granted actions on atharvnaphade/carbonpanel: ${ACTIONS:-none}"
            case ",$ACTIONS," in
              *,push,*) echo "Push permission confirmed." ;;
              *)
                echo "has_creds=false" >> "$GITHUB_OUTPUT"
                echo "::error::Docker Hub login works but this account has no push access to atharvnaphade/carbonpanel. Use an account with write access to that repository and a PAT with Read & Write scope."
                exit 1
                ;;
            esac
          else
            LOGIN_STATUS=$?
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "login_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Docker Hub authentication failed (exit code $LOGIN_STATUS)."
            exit $LOGIN_STATUS
          fi

      # A schedule may reach buildx with push=true. Re-read the live main tip
      # and re-verify exact-commit CI HERE, before any immutable sha write, so
      # a run that started qualified cannot publish a stale/moving target.
      - name: Late main and exact-CI check before any immutable write (schedule)
        id: scheduled_prepush
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_COMMIT: ${{ steps.pinned.outputs.sha }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current" != "$PINNED_COMMIT" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main moved after pinning; no immutable write"
            exit 0
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"
          python3 scripts/release.py verify-main-ci --commit "$PINNED_COMMIT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            atharvnaphade/carbonpanel
          # Buildx writes ONLY the immutable sha reference; edge and nightly are
          # promoted later from the verified digest by explicit gated steps.
          tags: |
            type=raw,value=sha-${{ steps.pinned.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Carbon Panel
            org.opencontainers.image.description=A modern Minecraft server and modpack management panel
            org.opencontainers.image.url=https://carbonpanel.dev/
            org.opencontainers.image.documentation=https://carbonpanel.dev/docs/
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.source=https://github.com/athNdev/carbonpanel
            org.opencontainers.image.revision=${{ steps.pinned.outputs.sha }}
          flavor: |
            latest=false

      - name: Build (and optionally push) Docker Image
        id: push
        # A reused verified sha image needs no rebuild. Verification-only runs
        # still build locally with push=false.
        if: ${{ steps.sha_gate.outputs.action == '' || steps.sha_gate.outputs.action == 'push' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.carbon-panel
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ (steps.channel.outputs.publish == 'true' || steps.nightly.outputs.publish == 'true') && steps.sha_gate.outputs.action == 'push' && steps.check-creds.outputs.has_creds == 'true' && github.event_name != 'pull_request' && steps.scheduled_prepush.outputs.stable != 'false' && steps.scheduled_prepush.outputs.verified != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=edge
            APP_COMMIT=${{ steps.pinned.outputs.sha }}
      - name: Resolve the verified immutable digest (new push or verified reuse)
        id: verified_digest
        env:
          SHA_ACTION: ${{ steps.sha_gate.outputs.action }}
          REUSED_DIGEST: ${{ steps.sha_gate.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$SHA_ACTION" = "reuse" ]; then
            echo "digest=$REUSED_DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "digest=$PUSHED_DIGEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Re-check the scheduled main pin before moving the nightly alias
        id: scheduled_recheck
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_COMMIT: ${{ steps.pinned.outputs.sha }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current" != "$PINNED_COMMIT" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::main moved after pinning; skipping the nightly alias move"
            exit 0
          fi
          echo "stable=true" >> "$GITHUB_OUTPUT"
          # A CI run can turn non-green between the buildx push and this alias
          # move. Re-verify the EXACT pinned commit here; the pre-push result is
          # stale by this point and is never reused as CI evidence for a move.
          python3 scripts/release.py verify-main-ci --commit "$PINNED_COMMIT"
      # OSS-413: all moving-alias writes are owned exclusively by the
      # `channel-transaction` job below. The former edge/nightly manual and
      # schedule alias-write steps were REMOVED; this job only builds and
      # verifies the immutable sha image and never moves a moving alias.

  # OSS-413 qualified channel transaction. Phase 1 (stage) is zero-write and
  # diagnoses the candidate without touching aliases or canonical docs. The
  # candidate marker is probed at the NON-ACTIVE staging route
  # /docs/candidate/<sha>/, never at /docs/ or /docs/nightly/. Only after the
  # probe and canonical markers are confirmed over HTTPS does phase 2 move the
  # aliases; partial failure rolls back docs and aliases to the prior receipt.
  # ONE shared non-cancelling `pages-deploy` lock, no nested group, no dispatch.
  channel-transaction:
    name: Qualified channel transaction (both registries and docs)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: >-
      vars.NIGHTLY_RECOVERY_ACTIVE != 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.nightly && inputs.recovery == 'off'))
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DOCKER_HUB_IMAGE: atharvnaphade/carbonpanel
    outputs:
      stage_action: ${{ steps.stage_decision.outputs.action }}
      action: ${{ steps.commit_decision.outputs.action }}
      digest: ${{ steps.stage.outputs.digest }}
      receipt: ${{ steps.commit_decision.outputs.receipt }}
    steps:
      - name: Resolve the exact current main revision
        id: pinned
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            first=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            second=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            if [ -z "$first" ] || [ "$first" != "$second" ]; then
              echo "stable=false" >> "$GITHUB_OUTPUT"
              echo "::warning::main tip could not be pinned; transaction skipped"
              exit 0
            fi
            echo "sha=$first" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${RUN_SHA:-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the exact pinned revision
        if: steps.pinned.outputs.stable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pinned.outputs.sha }}
          fetch-depth: 0
      - name: Assert checked-out HEAD equals the pinned revision
        if: steps.pinned.outputs.stable == 'true'
        env:
          EXPECTED_SHA: ${{ steps.pinned.outputs.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out HEAD $actual differs from verified commit $EXPECTED_SHA"
            exit 1
          fi

      - name: Verify exact-commit main CI for the pinned revision
        id: ci
        if: steps.pinned.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py verify-main-ci --commit "${{ steps.pinned.outputs.sha }}"

      - name: Gate exact source revision and qualified stage
        id: source
        if: steps.pinned.outputs.stable == 'true'
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          python3 scripts/release.py channel-source-gate \
            --event "$CHANNEL_EVENT" --ref "$CHANNEL_REF" --commit "$CHANNEL_COMMIT" \
            --ci-verified "$CHANNEL_CI_VERIFIED"

      - name: Set up Node
        if: steps.pinned.outputs.stable == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Set up Bun
        if: steps.pinned.outputs.stable == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Set up Buf
        if: steps.pinned.outputs.stable == 'true'
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Observe the immutable sha reference in BOTH registries before the docs
      # build: the staged digest is the Nightly candidate input, so the build
      # must render the real candidate page, never the baseline. Read-only. A
      # verified sha tag is REUSED on retry (never rebuilt); a missing or
      # unverified tag leaves this run as opt-off staging with zero writes.
      - name: Observe the immutable sha reference in both registries
        id: sha_obs
        if: steps.pinned.outputs.stable == 'true'
        env:
          REF: sha-${{ steps.pinned.outputs.sha }}
        run: |
          OBS=$(python3 scripts/release.py channel-observe --reference "$REF" | jq -c .observations)
          printf 'observations=%s\n' "$OBS" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.pinned.outputs.stable == 'true'
      - name: Sign in to the linked GitHub container registry
        if: steps.pinned.outputs.stable == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Ensure immutable Nightly sha counterpart on GHCR (authorized only)
        id: sha_mirror
        if: >-
          steps.pinned.outputs.stable == 'true' &&
          ((github.event_name == 'workflow_dispatch' && inputs.nightly) ||
          (github.event_name == 'schedule' && vars.NIGHTLY_SCHEDULE_PUBLISH == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
          NIGHTLY_OPT_IN: ${{ inputs.nightly }}
          RECOVERY: 'false'
          PIN_STABLE: ${{ steps.pinned.outputs.stable }}
          SCHEDULE_OPT_IN: ${{ vars.NIGHTLY_RECOVERY_ACTIVE != 'true' && vars.NIGHTLY_SCHEDULE_PUBLISH || 'false' }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" != "$CHANNEL_COMMIT" ]; then
            echo "::error::main moved after pinning; refusing the stale mirror"
            exit 1
          fi
          python3 scripts/release.py mirror-ghcr-sha \
            --commit "$CHANNEL_COMMIT" --event "$CHANNEL_EVENT" --ref "$CHANNEL_REF" \
            --ci-verified "$CHANNEL_CI_VERIFIED" --nightly-opt-in "$NIGHTLY_OPT_IN" \
            --recovery "$RECOVERY" --pin-stable "$PIN_STABLE" \
            --schedule-opt-in "$SCHEDULE_OPT_IN" --apply
          # Re-observe after any mirror attempt so activation/stage use real state.
          OBS=$(python3 scripts/release.py channel-observe --reference "sha-$CHANNEL_COMMIT" | jq -c .observations)
          printf 'observations=%s\n' "$OBS" >> "$GITHUB_OUTPUT"
      - name: Classify first Nightly activation from real immutable observations
        id: activation
        if: steps.pinned.outputs.stable == 'true'
        env:
          OBS: ${{ steps.sha_mirror.outputs.observations || steps.sha_obs.outputs.observations }}
        run: |
          # Mixed Hub/GHCR state is a BLOCKED qualification, never a silent skip.
          python3 scripts/release.py nightly-activation-decision \
            --observations "$OBS" > activation.json
          cat activation.json >> "$GITHUB_STEP_SUMMARY"
          ACTION=$(jq -r .action activation.json)
          REASON=$(jq -r .reason activation.json)
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ "$ACTION" = "blocked" ]; then
            echo "::warning::Nightly first activation blocked: $REASON"
          fi
      - name: Resolve the staged immutable digest (reuse on retry)
        id: stage
        if: steps.pinned.outputs.stable == 'true' && steps.activation.outputs.action == 'activate'
        env:
          OBS: ${{ steps.sha_mirror.outputs.observations || steps.sha_obs.outputs.observations }}
        run: |
          PRESENT=$(printf '%s' "$OBS" | jq -r '.docker_hub[0] == "present" and .ghcr[0] == "present"')
          if [ "$PRESENT" = "true" ]; then
            DIGEST=$(printf '%s' "$OBS" | jq -r '.docker_hub[1].digest')
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            # REAL observations, never a fabricated identical pair: both
            # registry digests are carried into every receipt and gate.
            echo "observed=$(printf '%s' "$OBS" | jq -c '{docker_hub:.docker_hub[1].digest,ghcr:.ghcr[1].digest}')" >> "$GITHUB_OUTPUT"
            echo "::notice::verified staged digest reused; no rebuild"
          else
            echo "::notice::no verified staged digest; this run is opt-off staging only"
          fi

      - name: Build and validate the off-path candidate probe
        id: docs
        if: steps.stage.outputs.digest != ''
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          python3 scripts/build_website.py --nightly-revision "$CHANNEL_COMMIT" \
            --nightly-digest "$CHANNEL_DIGEST" --promotion-state candidate \
            --promotion-receipt "staged-$CHANNEL_COMMIT"
          python3 scripts/check_website.py --expect-nightly-revision "$CHANNEL_COMMIT" \
            --expect-nightly-digest "$CHANNEL_DIGEST" --expect-promotion-state candidate \
            --expect-promotion-receipt "staged-$CHANNEL_COMMIT"
          mkdir -p .website-build/candidate-probe
          cp -a ".website-build/site/docs/candidate/$CHANNEL_COMMIT/." .website-build/candidate-probe/
          PAGE=".website-build/candidate-probe/getting-started/proxmox/index.html"
          test -s "$PAGE"
          grep -q "raw.githubusercontent.com/athNdev/carbonpanel/main/scripts/proxmox/install-carbon-panel.sh" "$PAGE"

      - name: Sign in to Docker Hub
        if: steps.pinned.outputs.stable == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Observe live aliases and reconstruct the active receipt
        id: active
        if: steps.pinned.outputs.stable == 'true'
        run: |
          ALIASES=$(python3 scripts/release.py channel-observe --reference nightly | jq -c .observations)
          printf 'aliases=%s\n' "$ALIASES" >> "$GITHUB_OUTPUT"
      - name: Read the live canonical docs marker over HTTPS
        id: live_marker
        if: steps.pinned.outputs.stable == 'true'
        run: |
          LIVE=$(curl -fsSL https://carbonpanel.dev/version-index.json | jq -c '.channels.nightly')
          echo "commit=$(printf '%s' "$LIVE" | jq -r '.commit // empty')" >> "$GITHUB_OUTPUT"
          echo "digest=$(printf '%s' "$LIVE" | jq -r '.image.digest // empty')" >> "$GITHUB_OUTPUT"

      # Preserve the EXACT bytes of the currently DEPLOYED Pages artifact before
      # any write. A freshly rebuilt site is not a rollback source: the prior
      # artifact is downloaded and byte-verified against the live index.
      - name: Preserve the exact prior docs artifact before any candidate write
        id: preserve_prior
        if: steps.docs.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .website-build/prior-site
          # Single shared gate: successful deployment identity, exact artifact
          # and real live-byte qualification all live in docs_publication_gate.
          BASE=$(python3 scripts/docs_publication_gate.py pages-baseline \
            --repository "$GITHUB_REPOSITORY")
          test "$(printf '%s' "$BASE" | jq -r .artifact_verified)" = "true"
          RESULT=$(python3 scripts/docs_publication_gate.py fetch-prior-pages \
            --site .website-build/prior-site --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$(printf '%s' "$BASE" | jq -r .artifact_id)" \
            --run-id "$(printf '%s' "$BASE" | jq -r .run_id)")
          test "$(printf '%s' "$RESULT" | jq -r .verified)" = "true"
          echo "hash=$(printf '%s' "$RESULT" | jq -r .hash)" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$(printf '%s' "$RESULT" | jq -r .artifact_id)" >> "$GITHUB_OUTPUT"
          echo "artifact_commit=$(printf '%s' "$RESULT" | jq -r .artifact_commit)" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(printf '%s' "$BASE" | jq -r .deployment_id)" >> "$GITHUB_OUTPUT"
          echo "run_id=$(printf '%s' "$BASE" | jq -r .run_id)" >> "$GITHUB_OUTPUT"

      - name: Add the candidate probe to the exact currently deployed site
        id: compose_stage
        if: steps.preserve_prior.outcome == 'success'
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          rm -rf .website-build/site
          cp -a .website-build/prior-site .website-build/site
          target=".website-build/site/docs/candidate/$CHANNEL_COMMIT"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a .website-build/candidate-probe/. "$target/"
          python3 scripts/release.py stage-channel-marker \
            --site .website-build/site --channel nightly \
            --commit "$CHANNEL_COMMIT" --digest "$CHANNEL_DIGEST"
          DOCS_HASH=$(sha256sum .website-build/site/version-index.json | cut -d' ' -f1)
          echo "hash=sha256:$DOCS_HASH" >> "$GITHUB_OUTPUT"

      - name: PHASE 1 - qualified staging decision (zero writes)
        id: stage_decision
        if: steps.compose_stage.outcome == 'success'
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
          DOCS_HASH: ${{ steps.compose_stage.outputs.hash }}
          ALIASES: ${{ steps.active.outputs.aliases }}
          LIVE_COMMIT: ${{ steps.live_marker.outputs.commit }}
          LIVE_DIGEST: ${{ steps.live_marker.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          OBSERVED: ${{ steps.stage.outputs.observed }}
          CI_VERIFIED: ${{ steps.ci.outputs.verified }}
          NIGHTLY_OPT_IN: ${{ inputs.nightly }}
          IMMUTABLE_OK: ${{ steps.activation.outputs.action == 'activate' && steps.stage.outcome == 'success' }}
          SITE_OK: ${{ steps.docs.outcome == 'success' }}
        run: |
          prior_index=.website-build/prior-site/version-index.json
          python3 scripts/release.py validate-channel-contract --path .website-build/site/version-index.json \
            --stable-commit "$(jq -er .channels.stable.commit "$prior_index")" \
            --stable-digest "$(jq -er .channels.stable.image.digest "$prior_index")"
          PREVIOUS=$(python3 scripts/release.py channel-active-receipt \
            --channel nightly --aliases "$ALIASES" \
            --docs-commit "$LIVE_COMMIT" --docs-digest "$LIVE_DIGEST")
          PREV_JSON=$(printf '%s' "$PREVIOUS" | jq -c .receipt)
          # The verified prior receipt is captured BEFORE any write and kept
          # separate from the candidate receipt returned by the commit decision.
          printf 'prior_receipt=%s\n' "$PREV_JSON" >> "$GITHUB_OUTPUT"
          SEQ=$(printf '%s' "$PREV_JSON" | jq -r '.seq // 0')
          CANDIDATE=$(jq -nc \
            --arg commit "$CHANNEL_COMMIT" --arg digest "$CHANNEL_DIGEST" \
            --argjson seq "$((SEQ + 1))" --arg ref "${{ github.ref }}" \
            --arg docs_hash "$DOCS_HASH" --arg run_id "$RUN_ID" \
            --argjson registries "$OBSERVED" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg ci "$CI_VERIFIED" --argjson immutable_ok "$IMMUTABLE_OK" \
            --argjson site_ok "$SITE_OK" \
            '{channel:"nightly",commit:$commit,digest:$digest,seq:$seq,source_ref:$ref,
              ci_verified:$ci,immutable_ok:$immutable_ok,contract_valid:true,site_validated:$site_ok,
              docs_commit:$commit,docs_digest:$digest,docs_artifact_hash:$docs_hash,
              registries:$registries,
              candidate_marker_verified:false,canonical_marker_verified:false,
              marker_urls:{nightly:"https://carbonpanel.dev/docs/nightly/"},
              run_ids:{ci:$run_id},timestamp:$now}')
          LIVE=$(jq -nc --arg c "$LIVE_COMMIT" --arg d "$LIVE_DIGEST" \
            '{registries:{},docs_commit:$c,docs_digest:$d}')
          printf 'candidate=%s\n' "$CANDIDATE" >> "$GITHUB_OUTPUT"
          python3 scripts/release.py channel-transaction --phase stage \
            --candidate "$CANDIDATE" --previous "$PREV_JSON" --live "$LIVE" \
            --event "$CHANNEL_EVENT" --nightly-opt-in "$NIGHTLY_OPT_IN"

      # Verify the staged artifact before any public write: the canonical
      # Stable/Nightly site must still match the live active receipt (the
      # registries' current state), with the exact pair only in the probe.
      - name: Verify the full canonical stage artifact with the off-path probe
        id: markers
        if: steps.stage_decision.outputs.action == 'stage'
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
          ACTIVE_COMMIT: ${{ steps.live_marker.outputs.commit }}
          ACTIVE_DIGEST: ${{ steps.live_marker.outputs.digest }}
        run: |
          python3 scripts/release.py verify-staged-page-site \
            --site .website-build/site \
            --candidate-commit "$CHANNEL_COMMIT" --candidate-digest "$CHANNEL_DIGEST" \
            --active-commit "$ACTIVE_COMMIT" --active-digest "$ACTIVE_DIGEST" \
            --stable-source .website-build/prior-site/version-index.json
          python3 scripts/release.py validate-channel-contract \
            --path .website-build/site/version-index.json \
            --stable-commit "$(jq -er .channels.stable.commit .website-build/prior-site/version-index.json)" \
            --stable-digest "$(jq -er .channels.stable.image.digest .website-build/prior-site/version-index.json)"
      - name: Upload the full canonical stage artifact with the candidate probe
        if: steps.markers.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-nightly-probe
          path: .website-build/site
      - name: Deploy the off-path Nightly candidate probe
        id: deploy
        if: steps.markers.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-nightly-probe

      # Probe the NON-ACTIVE staging route only. Canonical routes are never used
      # for the candidate probe.
      - name: Confirm the public candidate probe marker (non-active path)
        id: probe
        if: steps.deploy.outcome == 'success'
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          URL="https://carbonpanel.dev/docs/candidate/$CHANNEL_COMMIT/marker.json"
          PROBE=$(curl -fsSL "$URL")
          test "$(printf '%s' "$PROBE" | jq -r '.candidate_commit')" = "$CHANNEL_COMMIT"
          test "$(printf '%s' "$PROBE" | jq -r '.candidate_digest')" = "$CHANNEL_DIGEST"
          test "$(printf '%s' "$PROBE" | jq -r '.canonical')" = "false"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Confirm canonical docs still match the active receipt before alias move
        id: canonical
        if: steps.probe.outcome == 'success'
        env:
          ACTIVE_COMMIT: ${{ steps.live_marker.outputs.commit }}
          ACTIVE_DIGEST: ${{ steps.live_marker.outputs.digest }}
        run: |
          LIVE=$(curl -fsSL https://carbonpanel.dev/version-index.json | jq -c '.channels.nightly')
          test "$(printf '%s' "$LIVE" | jq -r '.commit')" = "$ACTIVE_COMMIT"
          test "$(printf '%s' "$LIVE" | jq -r '.image.digest')" = "$ACTIVE_DIGEST"
          curl -fsSL https://carbonpanel.dev/docs/ -o /dev/null
          curl -fsSL https://carbonpanel.dev/docs/nightly/ -o /dev/null

      - name: PHASE 2 - commit decision, then move both registry aliases
        id: commit_decision
        if: steps.canonical.outcome == 'success'
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          NIGHTLY_OPT_IN: ${{ inputs.nightly }}
          STAGED_CANDIDATE: ${{ steps.stage_decision.outputs.candidate }}
          PREV_JSON: ${{ steps.stage_decision.outputs.prior_receipt }}
          LIVE_COMMIT: ${{ steps.live_marker.outputs.commit }}
          LIVE_DIGEST: ${{ steps.live_marker.outputs.digest }}
          PROBE_URL: ${{ steps.probe.outputs.url }}
        run: |
          CANDIDATE=$(jq -ce --arg probe "$PROBE_URL" '
            .candidate_marker_verified = true |
            .canonical_marker_verified = true |
            .marker_urls.candidate = $probe' <<< "$STAGED_CANDIDATE")
          LIVE=$(jq -nc --arg c "$LIVE_COMMIT" --arg d "$LIVE_DIGEST" \
            '{registries:{},docs_commit:$c,docs_digest:$d}')
          python3 scripts/release.py channel-transaction --phase commit \
            --candidate "$CANDIDATE" --previous "$PREV_JSON" --live "$LIVE" \
            --event "$CHANNEL_EVENT" --nightly-opt-in "$NIGHTLY_OPT_IN"

      - name: Re-check the main pin before moving aliases
        id: late_recheck
        if: steps.commit_decision.outputs.action == 'publish' || steps.commit_decision.outputs.action == 'reconcile'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_COMMIT: ${{ steps.pinned.outputs.sha }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$current" != "$PINNED_COMMIT" ]; then
            echo "::error::main moved after pinning; refusing stale promotion"
            exit 1
          fi
          python3 scripts/release.py verify-main-ci --commit "$PINNED_COMMIT"
      - name: Move the nightly alias in BOTH registries by verified digest
        id: alias_move
        if: steps.late_recheck.outcome == 'success'
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
          PRIOR: ${{ steps.stage_decision.outputs.prior_receipt }}
          SHA_OBS: ${{ steps.sha_mirror.outputs.observations || steps.sha_obs.outputs.observations }}
        run: |
          # The real sha-tag observations from BOTH registries - no fabricated
          # identical pair. channel-promote re-verifies each observation.
          IMMUTABLE=$(printf '%s' "$SHA_OBS" | jq -c .)
          PREVIOUS_COMMIT=$(jq -er 'select(.verified == true and .channel == "nightly") | .revision' <<< "$PRIOR")
          PREVIOUS_DIGEST=$(jq -er '.digest' <<< "$PRIOR")
          ALIASES=$(python3 scripts/release.py channel-observe --reference nightly | jq -ce .observations)
          python3 scripts/release.py channel-promote \
            --channel nightly --commit "$CHANNEL_COMMIT" --digest "$CHANNEL_DIGEST" \
            --ci-verified "true" --immutable "$IMMUTABLE" --aliases "$ALIASES" \
            --previous-commit "$PREVIOUS_COMMIT" --previous-digest "$PREVIOUS_DIGEST" \
            --previous-binding true --apply

      # Reconcile the public canonical site with the NEW aliases only after both
      # registry moves succeed. Before this point the canonical docs stay at the
      # active receipt, so no interval can disagree with the registries.
      - name: Build and validate the final canonical artifact from the exact pair
        id: final_artifact
        if: steps.alias_move.outcome == 'success'
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          prior_index=.website-build/prior-site/version-index.json
          stable_tag=$(jq -er .channels.stable.tag "$prior_index")
          if [ "$stable_tag" != "v1.0.40" ]; then
            export CARBONPANEL_STABLE_TAG="$stable_tag"
            export CARBONPANEL_STABLE_REVISION="$(jq -er .channels.stable.commit "$prior_index")"
            export CARBONPANEL_STABLE_DIGEST="$(jq -er .channels.stable.image.digest "$prior_index")"
          fi
          python3 scripts/build_website.py --nightly-revision "$CHANNEL_COMMIT" \
            --nightly-digest "$CHANNEL_DIGEST" --promotion-state final \
            --promotion-receipt "final-$CHANNEL_COMMIT"
          # Exact HTML checks: updated canonical guide and preserved Stable routes.
          python3 scripts/release.py verify-channel-docs \
            --site .website-build/site --channel nightly \
            --commit "$CHANNEL_COMMIT" --digest "$CHANNEL_DIGEST" \
            --page getting-started/proxmox \
            --contains "raw.githubusercontent.com/athNdev/carbonpanel/main/scripts/proxmox/install-carbon-panel.sh" \
            --stable-source .website-build/prior-site/version-index.json
          test -s .website-build/site/docs/index.html
          test -s .website-build/site/docs/getting-started/proxmox/index.html
          test -s .website-build/site/docs/nightly/index.html
          echo "final_built=true" >> "$GITHUB_OUTPUT"
      - name: Provision Chromium for browser QA
        id: chromium
        if: steps.final_artifact.outcome == 'success'
        working-directory: scripts/manual-review/e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          # Use the exact browser installed by the pinned Playwright package;
          # do not override it with an arbitrary cached binary.
      - name: Browser-qualify Stable/Nightly channels on the final artifact
        id: browser_ui
        if: steps.final_artifact.outcome == 'success'
        env:
          CARBONPANEL_EXPECT_NIGHTLY_REVISION: ${{ steps.pinned.outputs.sha }}
          CARBONPANEL_EXPECT_NIGHTLY_DIGEST: ${{ steps.stage.outputs.digest }}
          CARBONPANEL_EXPECT_PROMOTION_STATE: final
        run: python3 scripts/browser_version_check.py
      - name: Upload the final canonical artifact
        id: final_upload
        if: steps.browser_ui.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .website-build/site
      - name: Deploy the final canonical artifact
        id: final_deploy
        if: steps.final_upload.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Live browser QA on deployed HTTPS (switcher, pins, both channels)
        id: live_browser
        if: steps.final_deploy.outcome == 'success'
        env:
          CARBONPANEL_EXPECT_NIGHTLY_REVISION: ${{ steps.pinned.outputs.sha }}
          CARBONPANEL_EXPECT_NIGHTLY_DIGEST: ${{ steps.stage.outputs.digest }}
          CARBONPANEL_EXPECT_PROMOTION_STATE: final
        run: python3 scripts/browser_version_check.py --base-url https://carbonpanel.dev
      - name: Confirm final alias and canonical docs agreement
        id: final_verify
        if: steps.live_browser.outcome == 'success'
        env:
          CHANNEL_COMMIT: ${{ steps.pinned.outputs.sha }}
          CHANNEL_DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          LIVE=$(curl -fsSL https://carbonpanel.dev/version-index.json | jq -c '.channels.nightly')
          test "$(printf '%s' "$LIVE" | jq -r '.commit')" = "$CHANNEL_COMMIT"
          test "$(printf '%s' "$LIVE" | jq -r '.image.digest')" = "$CHANNEL_DIGEST"
          OBS=$(python3 scripts/release.py channel-observe --reference nightly | jq -c .observations)
          test "$(printf '%s' "$OBS" | jq -r '.docker_hub[1].digest')" = "$CHANNEL_DIGEST"
          test "$(printf '%s' "$OBS" | jq -r '.ghcr[1].digest')" = "$CHANNEL_DIGEST"
          curl -fsSL https://carbonpanel.dev/docs/ -o /dev/null
          curl -fsSL https://carbonpanel.dev/docs/getting-started/proxmox/ -o /dev/null
          curl -fsSL https://carbonpanel.dev/docs/nightly/getting-started/proxmox/ \
            | grep -q "raw.githubusercontent.com/athNdev/carbonpanel/main/scripts/proxmox/install-carbon-panel.sh"

      # Genuine failure branch. always() with explicit outcome checks and NO
      # commit_decision success guard (a deploy/probe failure skips that step).
      # PRIOR is the receipt captured by phase 1 BEFORE any write, never the
      # candidate receipt returned by the commit decision.
      - name: Restore prior verified aliases after partial failure
        id: rollback
        if: >-
          always() && steps.stage_decision.outputs.action == 'stage' &&
          (steps.markers.outcome == 'failure' || steps.deploy.outcome == 'failure' ||
           steps.probe.outcome == 'failure' || steps.canonical.outcome == 'failure' ||
           steps.commit_decision.outcome == 'failure' ||
           steps.commit_decision.outputs.action == 'rollback' ||
           steps.late_recheck.outcome == 'failure' || steps.alias_move.outcome == 'failure' || steps.final_artifact.outcome == 'failure' ||
           steps.final_deploy.outcome == 'failure' || steps.chromium.outcome == 'failure' ||
           steps.browser_ui.outcome == 'failure' || steps.final_upload.outcome == 'failure' ||
           steps.live_browser.outcome == 'failure' || steps.final_verify.outcome == 'failure')
        env:
          PRIOR: ${{ steps.stage_decision.outputs.prior_receipt }}
        run: |
          test -n "$PRIOR" || { echo "::error::no verified prior receipt to restore"; exit 1; }
          python3 scripts/release.py channel-rollback --receipt "$PRIOR" --apply

      # Restore the EXACT prior docs bytes saved before any candidate write.
      # A re-stamp cannot restore byte identity, so a distinct artifact is used.
      - name: Upload the exact prior docs bytes as a distinct Pages artifact
        id: rollback_docs
        if: always() && steps.rollback.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-prior
          path: .website-build/prior-site
      - name: Deploy the exact prior docs bytes
        id: rollback_deploy
        if: always() && steps.rollback_docs.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-prior
      - name: Verify restored aliases and public docs bytes/marker
        if: always() && steps.rollback_deploy.outcome == 'success'
        env:
          PRIOR: ${{ steps.stage_decision.outputs.prior_receipt }}
          PRIOR_HASH: ${{ steps.preserve_prior.outputs.hash }}
        run: |
          PRIOR_DIGEST=$(printf '%s' "$PRIOR" | jq -r '.digest')
          OBS=$(python3 scripts/release.py channel-observe --reference nightly | jq -c .observations)
          test "$(printf '%s' "$OBS" | jq -r '.docker_hub[1].digest')" = "$PRIOR_DIGEST"
          test "$(printf '%s' "$OBS" | jq -r '.ghcr[1].digest')" = "$PRIOR_DIGEST"
          LIVE_HASH=$(curl -fsSL https://carbonpanel.dev/version-index.json | sha256sum | cut -d' ' -f1)
          test "sha256:$LIVE_HASH" = "$PRIOR_HASH"
          LIVE=$(curl -fsSL https://carbonpanel.dev/version-index.json | jq -c '.channels.nightly')
          test "$(printf '%s' "$LIVE" | jq -r '.image.digest')" = "$PRIOR_DIGEST"
      - name: Fail the run when a rollback was required
        if: always() && steps.rollback.outcome == 'success'
        run: |
          echo "::error::channel transaction rolled back to the prior verified receipt; no success reported"
          exit 1

      - name: Record the verified receipt as a workflow artifact (not main)
        if: steps.final_verify.outcome == 'success'
        env:
          RECEIPT: ${{ steps.commit_decision.outputs.receipt }}
        run: |
          printf '%s\n' "$RECEIPT" > channel-receipt.json
          python3 -c "import json; r=json.load(open('channel-receipt.json')); assert r['verified'] and r['registries']['docker_hub']==r['registries']['ghcr']"
      - name: Upload the channel receipt artifact
        if: steps.final_verify.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-receipt-${{ steps.pinned.outputs.sha }}
          path: channel-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail when an explicit Nightly transaction was requested but not completed
        if: always() && github.event_name == 'workflow_dispatch' && inputs.nightly && inputs.recovery == 'off' && steps.final_verify.outcome != 'success' && steps.stage_decision.outputs.action != 'noop' && steps.commit_decision.outputs.action != 'noop'
        run: |
          echo "::error::explicit Nightly transaction was requested but did not complete"
          exit 1
      # The Docker Hub full_description is owned solely by
      # .github/workflows/dockerhub-description.yml. Image/channel publication
      # must never overwrite it with a raw, older README.

  rehearse-nightly-recovery:
    name: Nightly recovery rehearsal (mock services)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest scripts.test_nightly_recovery -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ github.token }}
      - name: Exercise both real docs renders with fixture digests
        env:
          NIGHTLY_RECOVERY_RENDER_REHEARSAL: 'true'
        run: python3 -m unittest scripts.test_nightly_recovery.RenderedPlanRehearsal -v

  plan-nightly-recovery:
    name: Read Nightly recovery evidence (${{ inputs.recovery }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.recovery == 'prepare' || inputs.recovery == 'inspect')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_PHASE: ${{ inputs.recovery }}
      RECOVERY_EVIDENCE: ${{ inputs.recovery_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node for the Pages plan
        if: inputs.recovery == 'prepare'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Set up Bun for the Pages plan
        if: inputs.recovery == 'prepare'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Set up Buf for the Pages plan
        if: inputs.recovery == 'prepare'
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve the split baseline and build the reviewed plan
        if: inputs.recovery == 'prepare'
        shell: bash
        run: python3 -m scripts.nightly_recovery prepare --config "$RECOVERY_EVIDENCE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the exact prior, staged and final site trees before any public write
        if: inputs.recovery == 'prepare'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-recovery-plan
          path: .nightly-recovery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Bind the reviewed plan
        if: inputs.recovery == 'inspect'
        run: |
          run_id=$(jq -re '.run | tostring | select(test("^[1-9][0-9]*$"))' <<< "$RECOVERY_EVIDENCE")
          digest=$(jq -re '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$RECOVERY_EVIDENCE")
          {
            echo "PLAN_RUN=$run_id"
            echo "PLAN_DIGEST=$digest"
          } >> "$GITHUB_ENV"
      - name: Inspect the live recovery state without mutating the channel
        if: inputs.recovery == 'inspect'
        shell: bash
        run: |
          python3 -m scripts.nightly_recovery decide --phase inspect \
            --plan-run "$PLAN_RUN" --plan-digest "$PLAN_DIGEST" > /dev/null
          expected=$(sed -n 's/^expected=//p' "$GITHUB_OUTPUT")
          python3 -m scripts.nightly_recovery verify --phase inspect \
            --plan-run "$PLAN_RUN" --plan-digest "$PLAN_DIGEST" --expected "$expected" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the inspection receipt
        if: inputs.recovery == 'inspect'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-recovery-receipt
          path: nightly-recovery-receipt.json
          if-no-files-found: error
          retention-days: 30

  recover-nightly:
    name: Recover split Nightly (${{ inputs.recovery }})
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      contains(fromJSON('["stage","hub","docs","commit","restore-hub","restore-docs"]'), inputs.recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: read
      packages: write
      pages: write
      id-token: write
    environment: ${{ contains(fromJSON('["stage","docs","restore-docs"]'), inputs.recovery) && 'github-pages' || 'nightly-recovery' }}
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_PHASE: ${{ inputs.recovery }}
      RECOVERY_EVIDENCE: ${{ inputs.recovery_evidence }}
    steps:
      - name: Require explicit controls for recovery writes
        env:
          RECOVERY_ACTIVE: ${{ vars.NIGHTLY_RECOVERY_ACTIVE }}
          LEGACY_SCHEDULE: ${{ vars.NIGHTLY_SCHEDULE_PUBLISH }}
          LEGACY_RECONCILE: ${{ vars.CHANNEL_RECONCILE_PUBLISH }}
          LEGACY_PUSH: ${{ inputs.push }}
          LEGACY_NIGHTLY: ${{ inputs.nightly }}
        run: |
          test "$RECOVERY_ACTIVE" = true
          test "$LEGACY_SCHEDULE" != true
          test "$LEGACY_RECONCILE" != true
          test "$LEGACY_PUSH" != true
          test "$LEGACY_NIGHTLY" != true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the reviewed plan
        run: |
          run_id=$(jq -re '.run | tostring | select(test("^[1-9][0-9]*$"))' <<< "$RECOVERY_EVIDENCE")
          digest=$(jq -re '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$RECOVERY_EVIDENCE")
          {
            echo "PLAN_RUN=$run_id"
            echo "PLAN_DIGEST=$digest"
          } >> "$GITHUB_ENV"
      - name: Re-observe the independent baselines and determine the single permitted action
        id: decision
        run: |
          python3 -m scripts.nightly_recovery decide --phase "$RECOVERY_PHASE" \
            --plan-run "$PLAN_RUN" --plan-digest "$PLAN_DIGEST"
      - name: Upload the Pages tree bound to the requested post-state
        if: contains(fromJSON('["stage","docs","restore-docs"]'), inputs.recovery)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .nightly-recovery/${{ steps.decision.outputs.pages_tree }}
          include-hidden-files: true
          retention-days: 30
      - name: Check live state again before Pages deployment
        if: contains(fromJSON('["stage","final","prior"]'), steps.decision.outputs.action)
        id: pages_recheck
        run: |
          python3 -m scripts.nightly_recovery decide --phase "$RECOVERY_PHASE" \
            --plan-run "$PLAN_RUN" --plan-digest "$PLAN_DIGEST"
      - name: Deploy the selected Pages artifact
        if: steps.pages_recheck.outputs.action != '' && steps.pages_recheck.outputs.action == steps.decision.outputs.action
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.decision.outputs.action == 'hub' || steps.decision.outputs.action == 'hub-prior'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.decision.outputs.action == 'ghcr'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Apply only the selected digest-addressed Nightly alias
        if: contains(fromJSON('["hub","hub-prior","ghcr"]'), steps.decision.outputs.action)
        run: |
          python3 -m scripts.nightly_recovery alias --phase "$RECOVERY_PHASE" \
            --plan-run "$PLAN_RUN" --plan-digest "$PLAN_DIGEST"
      - name: Verify the requested post-state and record observed evidence
        shell: bash
        env:
          EXPECTED_STATE: ${{ steps.decision.outputs.expected }}
        run: |
          python3 -m scripts.nightly_recovery verify --phase "$RECOVERY_PHASE" \
            --plan-run "$PLAN_RUN" --plan-digest "$PLAN_DIGEST" --expected "$EXPECTED_STATE" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain the recovery receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-recovery-receipt
          path: nightly-recovery-receipt.json
          if-no-files-found: error
          retention-days: 30
