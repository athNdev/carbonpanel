# SPDX-License-Identifier: MPL-2.0
name: Review session ownership
on:
  pull_request:
    paths:
      - 'scripts/review/**'
      - 'scripts/manual-review/**'
      - '.github/workflows/review-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review/**'
      - 'scripts/manual-review/**'
      - '.github/workflows/review-ownership.yml'
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/review/test-ownership.sh
