# SPDX-License-Identifier: MPL-2.0
name: Review session ownership
on:
  pull_request:
    paths:
      - 'scripts/review/**'
      - 'scripts/manual-review/**'
      - '.github/workflows/review-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review/**'
      - 'scripts/manual-review/**'
      - '.github/workflows/review-ownership.yml'
jobs:
  driver:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: node scripts/review/setup-browser.mjs --with-deps
      - run: node --test scripts/review/browser.test.mjs
      - run: node scripts/review/browser-check.mjs
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/review/test-ownership.sh
