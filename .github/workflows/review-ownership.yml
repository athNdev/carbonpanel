# SPDX-License-Identifier: MPL-2.0
name: Review session ownership
on:
  pull_request:
    paths:
      - 'scripts/review/**'
      - 'scripts/manual-review/**'
      - '.github/workflows/review-ownership.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review/**'
      - 'scripts/manual-review/**'
      - '.github/workflows/review-ownership.yml'
jobs:
  driver:
    strategy:
      # Keep a failed ubuntu leg from cancelling the Windows leg during setup;
      # both platforms must report their own result for a dependency bump.
      fail-fast: false
      matrix:
        # Playwright install-deps uses the Microsoft apt repo, which returns
        # HTTP 403 for Ubuntu 26.04 (ubuntu-latest); use the supported noble leg.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: node scripts/review/setup-browser.mjs --with-deps
      - run: node --test scripts/review/browser.test.mjs
      - run: node --test scripts/review/profile.test.mjs
      - run: node --test scripts/review/entry-state.test.mjs
      - run: node scripts/review/browser-check.mjs
      - run: node --test scripts/review/profile-browser.test.mjs
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/review/test-ownership.sh
      - run: bash scripts/review/test-bluemap-ownership.sh
