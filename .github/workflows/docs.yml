# SPDX-License-Identifier: MPL-2.0
name: Website Checks
on:
  pull_request:
    paths:
      - 'landing/**'
      - 'docs/carbon-panel/**'
      - 'docs/design-system/**'
      - 'web/carbon-panel/src/lib/**'
      - 'web/carbon-panel/demo/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/studio/**'
      - 'docs/website-source.json'
      - 'docs/maintained-guides.json'
      - 'docs/version-index.json'
      - 'docs/release-history.json'
      - 'scripts/*website*'
      - 'scripts/version_contract.py'
      - 'scripts/maintained_guides.py'
      - 'scripts/test_maintained_guides.py'
      - 'scripts/version_bump.py'
      - 'scripts/openapi_version.py'
      - 'scripts/test_openapi_version.py'
      - 'scripts/browser_version_check.py'
      - 'scripts/test_version_contract.py'
      - 'scripts/test_landing_page.py'
      - 'scripts/test_design_system_page.py'
      - 'scripts/check_brand_assets.py'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'proto/carbonpanel/v1/auth.proto'
      - '.github/workflows/docs.yml'
      - '.github/workflows/landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    name: Website Build and Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test snapshot isolation, URL handling and version contract
        run: python3 -m unittest scripts.test_website scripts.test_version_contract scripts.test_maintained_guides scripts.test_landing_page scripts.test_design_system_page
      - name: Validate every version surface on the same commit
        run: python3 scripts/version_bump.py prepare --check
      - name: Build the homepage and exact-peel versioned docs
        run: python3 scripts/build_website.py
      - name: Check every local route, asset and version route
        run: python3 scripts/check_website.py
      - name: Validate rendered and packaged outputs with the atomic check
        run: python3 scripts/version_bump.py prepare --check --site .website-build/site
