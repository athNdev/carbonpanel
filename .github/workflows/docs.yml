# SPDX-License-Identifier: MPL-2.0
name: Website Checks
on:
  pull_request:
    paths:
      - 'landing/**'
      - 'docs/carbon-panel/**'
      - 'docs/design-system/**'
      - 'web/carbon-panel/src/lib/**'
      - 'web/carbon-panel/demo/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/studio/**'
      - 'docs/website-source.json'
      - 'scripts/*website*'
      - 'scripts/test_landing_page.py'
      - 'scripts/test_design_system_page.py'
      - 'scripts/check_brand_assets.py'
      - '.github/workflows/docs.yml'
      - '.github/workflows/landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    name: Website Build and Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
      - name: Test snapshot isolation and URL handling
        run: python3 -m unittest scripts.test_website scripts.test_landing_page scripts.test_design_system_page
      - name: Build the homepage and pinned docs
        run: python3 scripts/build_website.py
      - name: Check every local route and asset
        run: python3 scripts/check_website.py
