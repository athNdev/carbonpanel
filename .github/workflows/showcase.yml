# README showcase screenshots: real captures of the packaged application from
# a disposable seeded stack. Publication is split: capture is READ-ONLY, and a
# minimal `contents:write` job publishes only ONE dedicated asset branch with
# stable raw URLs. No direct main push, no new secret, no recursive CI.
#
# The publish job treats the workflow artifact as DATA ONLY: it executes the
# validator and reads the mandatory plan from an exact pinned `github.sha`
# checkout in a separate path, never from the artifact. Publication also
# checks provenance monotonicity against live main and the last published
# manifest, and requires the full README-canonical image set.
#
# The asset branch is seeded before README links change. See assets/showcase/
# README.md and scripts/showcase_assets.py for the manifest contract.

name: Showcase Screenshots

on:
  push:
    branches:
      - main
    paths:
      - 'web/carbon-panel/src/routes/+page.svelte'
      - 'web/carbon-panel/src/routes/players/**'
      - 'web/carbon-panel/src/routes/worlds/**'
      - 'web/carbon-panel/src/routes/library/**'
      - 'web/carbon-panel/src/routes/changelog/**'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/**'
      - 'web/carbon-panel/src/lib/components/**'
      - 'web/carbon-panel/src/lib/features/**'
      - 'web/carbon-panel/src/lib/design-system/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'scripts/review/plan-showcase.json'
      - 'scripts/review/journey.mjs'
      - 'scripts/review/entry-state.mjs'
      - 'scripts/review/entry-state.test.mjs'
      - 'scripts/review/devstack.sh'
      - 'scripts/showcase_assets.py'
      - 'scripts/showcase_assets.test.py'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:
    inputs:
      players:
        description: 'Capture player roster and allowlist (feature gate)'
        required: false
        default: true
        type: boolean
      playerdetail:
        description: 'Capture canonical player detail with a loaded skin preview (feature gate)'
        required: false
        default: false
        type: boolean
      worldtab:
        description: 'Capture the per-server World tab and Worlds list (independent of BlueMap)'
        required: false
        default: true
        type: boolean
      worlds:
        description: 'Capture rendered BlueMap tiles (independent gate; OSS-392)'
        required: false
        default: false
        type: boolean
      library:
        description: 'Capture World Library revisions/compatibility (feature gate)'
        required: false
        default: true
        type: boolean
      force_publish:
        description: 'Publish even when captured images are unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.sha }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source at the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert capture commit identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "checkout $actual != $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Validate the asset gate itself
        run: python3 scripts/showcase_assets.test.py

      - name: Install review driver
        run: node scripts/review/setup-browser.mjs --with-deps

      - name: Boot disposable seeded stack
        run: bash scripts/review/devstack.sh up
        env:
          # Isolated fixture credentials; never used outside this stack.
          PANEL_REVIEW_USER: reviewer
          PANEL_REVIEW_PASSWORD: Review-Panel-2026

      - name: Run showcase journey
        env:
          PANEL_REVIEW_USER: reviewer
          PANEL_REVIEW_PASSWORD: Review-Panel-2026
          FEATURES_PLAYERS: ${{ github.event_name == 'push' || inputs.players }}
          FEATURES_PLAYERDETAIL: ${{ inputs.playerdetail }}
          FEATURES_WORLDS: ${{ inputs.worlds }}
          FEATURES_WORLDTAB: ${{ github.event_name == 'push' || inputs.worldtab }}
          FEATURES_LIBRARY: ${{ github.event_name == 'push' || inputs.library }}
        run: |
          PORT="$(cat "${HOME}/.cache/carbon-panel-review/sessions/carbon-panel-review/port")"
          export SHOWCASE_SERVER_ID="$(cat "${HOME}/.cache/carbon-panel-review/sessions/carbon-panel-review/server-id")"
          FEATURES=""
          if [ "$FEATURES_PLAYERS" = "true" ]; then FEATURES="${FEATURES},players"; fi
          if [ "$FEATURES_PLAYERDETAIL" = "true" ]; then FEATURES="${FEATURES},playerdetail"; fi
          if [ "$FEATURES_WORLDS" = "true" ]; then FEATURES="${FEATURES},worlds"; fi
          if [ "$FEATURES_WORLDTAB" = "true" ]; then FEATURES="${FEATURES},worldtab"; fi
          if [ "$FEATURES_LIBRARY" = "true" ]; then FEATURES="${FEATURES},library"; fi
          FEATURES="${FEATURES#,}"
          EXTRA=()
          if [ -n "$FEATURES" ]; then EXTRA=(--features "$FEATURES"); fi
          node scripts/review/journey.mjs \
            --plan scripts/review/plan-showcase.json \
            --base "http://127.0.0.1:${PORT}" \
            --out /tmp/showcase \
            "${EXTRA[@]}"
          REQUIRED="$(node -e '
            const p=require("./scripts/review/plan-showcase.json");
            console.log(p.steps.filter(s=>s.screenshot&&!s.feature).map(s=>s.screenshot).join(" "));
          ')"
          for shot in $REQUIRED; do
            if [ ! -s "/tmp/showcase/${shot}.png" ]; then
              echo "missing required screenshot ${shot}" >&2
              exit 1
            fi
          done

      - name: Build and validate the asset bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FEATURES_PLAYERS: ${{ github.event_name == 'push' || inputs.players }}
          FEATURES_PLAYERDETAIL: ${{ inputs.playerdetail }}
          FEATURES_WORLDS: ${{ inputs.worlds }}
          FEATURES_WORLDTAB: ${{ github.event_name == 'push' || inputs.worldtab }}
          FEATURES_LIBRARY: ${{ github.event_name == 'push' || inputs.library }}
        run: |
          mkdir -p /tmp/showcase-bundle /tmp/showcase-artifact/bundle
          FEATURES=""
          if [ "$FEATURES_PLAYERS" = "true" ]; then FEATURES="${FEATURES},players"; fi
          if [ "$FEATURES_PLAYERDETAIL" = "true" ]; then FEATURES="${FEATURES},playerdetail"; fi
          if [ "$FEATURES_WORLDS" = "true" ]; then FEATURES="${FEATURES},worlds"; fi
          if [ "$FEATURES_WORLDTAB" = "true" ]; then FEATURES="${FEATURES},worldtab"; fi
          if [ "$FEATURES_LIBRARY" = "true" ]; then FEATURES="${FEATURES},library"; fi
          FEATURES="${FEATURES#,}"
          APP_VERSION="$(git describe --tags --always 2>/dev/null || printf 'packaged-review')"
          CAPTURED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DRIVER="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/showcase/browser.json","utf8")).driverVersion)')"
          BROWSER="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/showcase/browser.json","utf8")).browserVersion)')"
          python3 scripts/showcase_assets.py build \
            --images-dir /tmp/showcase \
            --publish-dir /tmp/showcase-bundle \
            --plan scripts/review/plan-showcase.json \
            --seed-script scripts/review/devstack.sh \
            --features "$FEATURES" \
            --source-sha "$SOURCE_SHA" \
            --source-ref "$SOURCE_REF" \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --captured-at "$CAPTURED_AT" \
            --app-version "$APP_VERSION" \
            --driver-version "$DRIVER" \
            --browser-version "$BROWSER"
          python3 scripts/showcase_assets.py validate \
            --publish-dir /tmp/showcase-bundle \
            --plan scripts/review/plan-showcase.json \
            --features "$FEATURES" \
            --expected-source-sha "$SOURCE_SHA"
          cp /tmp/showcase/report.md /tmp/showcase-artifact/report.md
          cp -R /tmp/showcase-bundle/. /tmp/showcase-artifact/bundle/

      - name: Upload validated data-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: showcase-asset-bundle
          path: /tmp/showcase-artifact
          if-no-files-found: error

      - name: Stop disposable stack
        if: always()
        run: bash scripts/review/devstack.sh down

  publish:
    name: Publish to asset branch (contents:write)
    needs: capture
    # Never publish from PRs, forks or a non-main ref.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: showcase-publish
      cancel-in-progress: false
    steps:
      - name: Check out ONLY the asset branch (write target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: showcase-assets
          fetch-depth: 1

      - name: Check out the EXACT trusted source, read-only, in a separate path
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          fetch-depth: 0
          persist-credentials: false

      - name: Assert trusted identity and target branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git -C trusted-source rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "trusted source is not the exact event commit" >&2
            exit 1
          fi
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "showcase-assets" ]; then
            echo "refusing to publish from a non-asset branch" >&2
            exit 1
          fi

      - name: Download data-only artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: showcase-asset-bundle
          path: /tmp/showcase-artifact

      - name: Reject unexpected artifact contents (data only, no code or plan)
        env:
          FEATURES_PLAYERS: ${{ github.event_name == 'push' || inputs.players }}
          FEATURES_PLAYERDETAIL: ${{ inputs.playerdetail }}
          FEATURES_WORLDS: ${{ inputs.worlds }}
          FEATURES_WORLDTAB: ${{ github.event_name == 'push' || inputs.worldtab }}
          FEATURES_LIBRARY: ${{ github.event_name == 'push' || inputs.library }}
        run: |
          FEATURES=""
          if [ "$FEATURES_PLAYERS" = "true" ]; then FEATURES="${FEATURES},players"; fi
          if [ "$FEATURES_PLAYERDETAIL" = "true" ]; then FEATURES="${FEATURES},playerdetail"; fi
          if [ "$FEATURES_WORLDS" = "true" ]; then FEATURES="${FEATURES},worlds"; fi
          if [ "$FEATURES_WORLDTAB" = "true" ]; then FEATURES="${FEATURES},worldtab"; fi
          if [ "$FEATURES_LIBRARY" = "true" ]; then FEATURES="${FEATURES},library"; fi
          FEATURES="${FEATURES#,}"
          FEATURES="$FEATURES" python3 - <<'PY'
          import os, sys, json
          root = '/tmp/showcase-artifact'
          plan = json.load(open('trusted-source/scripts/review/plan-showcase.json', encoding='utf-8'))
          enabled = {f for f in os.environ.get('FEATURES', '').split(',') if f}
          allowed = {'report.md', 'bundle/manifest.json'}
          required = set()
          for step in plan.get('steps', []):
              name = step.get('screenshot')
              feature = step.get('feature')
              if not name:
                  continue
              if not feature:
                  required.add('bundle/' + name + '.png')
              if not feature or feature in enabled:
                  allowed.add('bundle/' + name + '.png')
          found = set()
          for directory, _, files in os.walk(root):
              for name in files:
                  found.add(os.path.relpath(os.path.join(directory, name), root).replace('\\', '/'))
          extra = sorted(found - allowed)
          missing = sorted(required - found)
          if extra or missing:
              print('unexpected artifact files:', extra, 'missing required files:', missing, file=sys.stderr)
              sys.exit(1)
          for path in sorted(found):
              if path.endswith(('.py', '.js', '.mjs', '.sh', '.exe', '.dll')) or 'plan-showcase' in path:
                  print('artifact may not carry executable code or a plan:', path, file=sys.stderr)
                  sys.exit(1)
          print('artifact shape verified:', len(found), 'data files')
          PY

      - name: Validate bundle against the pinned source plan
        env:
          SOURCE_SHA: ${{ github.sha }}
          FEATURES_PLAYERS: ${{ github.event_name == 'push' || inputs.players }}
          FEATURES_PLAYERDETAIL: ${{ inputs.playerdetail }}
          FEATURES_WORLDS: ${{ inputs.worlds }}
          FEATURES_WORLDTAB: ${{ github.event_name == 'push' || inputs.worldtab }}
          FEATURES_LIBRARY: ${{ github.event_name == 'push' || inputs.library }}
        run: |
          FEATURES=""
          if [ "$FEATURES_PLAYERS" = "true" ]; then FEATURES="${FEATURES},players"; fi
          if [ "$FEATURES_PLAYERDETAIL" = "true" ]; then FEATURES="${FEATURES},playerdetail"; fi
          if [ "$FEATURES_WORLDS" = "true" ]; then FEATURES="${FEATURES},worlds"; fi
          if [ "$FEATURES_WORLDTAB" = "true" ]; then FEATURES="${FEATURES},worldtab"; fi
          if [ "$FEATURES_LIBRARY" = "true" ]; then FEATURES="${FEATURES},library"; fi
          FEATURES="${FEATURES#,}"
          python3 trusted-source/scripts/showcase_assets.py validate \
            --publish-dir /tmp/showcase-artifact/bundle \
            --plan trusted-source/scripts/review/plan-showcase.json \
            --features "$FEATURES" \
            --expected-source-sha "$SOURCE_SHA"

      - name: Require the full README-canonical image set
        run: |
          for name in \
            showcase-dashboard showcase-server-detail showcase-studio showcase-modpacks \
            showcase-library showcase-library-revisions showcase-player-allowlist
          do
            if [ ! -s "/tmp/showcase-artifact/bundle/${name}.png" ]; then
              echo "README-canonical screenshot missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Guard provenance monotonicity against live main and last publish
        id: provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C trusted-source fetch --quiet origin main
          main_sha="$(git -C trusted-source rev-parse refs/remotes/origin/main)"
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo "capture source $SOURCE_SHA is not live main $main_sha (delayed or superseded)" >&2
            exit 1
          fi
          last="assets/showcase/manifest.json"
          if [ ! -f "$last" ]; then
            echo "asset branch has no last-good manifest" >&2
            exit 1
          fi
          last_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["source"]["sha"])' "$last")"
          if ! git -C trusted-source cat-file -e "${last_sha}^{commit}" 2>/dev/null; then
            echo "last published commit $last_sha is unknown/divergent" >&2
            exit 1
          fi
          old_digest="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["contentDigest"])' "$last")"
          new_digest="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["contentDigest"])' /tmp/showcase-artifact/bundle/manifest.json)"
          if [ "$last_sha" = "$SOURCE_SHA" ]; then
            if [ "$old_digest" != "$new_digest" ]; then
              echo "re-run for $SOURCE_SHA would replace published assets with different bytes" >&2
              exit 1
            fi
            echo "already-current=true" >> "$GITHUB_OUTPUT"
          elif ! git -C trusted-source merge-base --is-ancestor "$last_sha" "$SOURCE_SHA"; then
            echo "capture $SOURCE_SHA is not a descendant of last published $last_sha" >&2
            exit 1
          fi

      - name: Decide whether publication is a no-op
        id: change
        if: steps.provenance.outputs.already-current != 'true'
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          if [ "$FORCE_PUBLISH" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            python3 trusted-source/scripts/showcase_assets.py noop \
              --current-manifest assets/showcase/manifest.json \
              --new-manifest /tmp/showcase-artifact/bundle/manifest.json >> "$GITHUB_OUTPUT"
          fi

      - name: Atomically update the asset branch
        if: steps.change.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Copy only validated data; prior good screenshots stay on failure.
          cp /tmp/showcase-artifact/bundle/*.png assets/showcase/
          cp /tmp/showcase-artifact/bundle/manifest.json assets/showcase/manifest.json
          git add assets/showcase
          git -c user.name='carbonpanel-ci' -c user.email='ci@carbonpanel.local' \
            commit -m "chore(showcase): publish captures for ${SOURCE_SHA}" \
            -- assets/showcase
          git push origin HEAD:showcase-assets
          echo "published ${SOURCE_SHA} to showcase-assets"
