# SPDX-License-Identifier: MPL-2.0
name: Carbon Panel Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release.py'
      - 'scripts/test_release.py'
      - 'internal/buildinfo/**'
      - 'cmd/carbon-panel/main.go'
      - 'cmd/carbon-storage/main.go'
      - 'docker/Dockerfile.release'
      - 'docker/Dockerfile.carbon-panel'
      - 'docs/release-bundle.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer tag, for example v3.0.0-alpha.1'
        required: true
        type: string
      revision:
        description: 'Commit or branch to build; publishing requires successful main CI'
        default: main
        type: string
      publish:
        description: 'Publish the versioned image and GitHub release (off = build and verify only)'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release version and source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      epoch: ${{ steps.plan.outputs.epoch }}
      date: ${{ steps.plan.outputs.date }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision || github.ref }}
      - name: Check release tooling
        run: python3 -m unittest scripts.test_release
      - name: Validate source and version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v0.0.0-verify.{0}', github.run_number) }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          args=(--version "$RELEASE_VERSION")
          if [ "$RELEASE_PUBLISH" = true ]; then args+=(--publish); fi
          python3 scripts/release.py plan "${args[@]}"

  frontend:
    name: Build versioned UI and API schema
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Go and TypeScript RPC code is checked in and tested by main CI. Generate
      # the download schema separately; do not replace tracked, licensed sources.
      - name: Generate the release OpenAPI schema
        run: >-
          buf generate --template
          '{"version":"v2","plugins":[{"remote":"buf.build/community/sudorandom-connect-openapi:v0.21.3","out":".website-build/release-schema","opt":["path=openapi.yaml"]}]}'
      - name: Build the embedded web UI
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd web/carbon-panel
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-inputs
          path: |
            web/carbon-panel/build
            .website-build/release-schema/openapi.yaml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  source-image:
    name: Verify native multi-platform source image build
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.carbon-panel
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            APP_VERSION=${{ needs.plan.outputs.version }}
            APP_COMMIT=${{ needs.plan.outputs.commit }}
            BUILD_DATE=${{ needs.plan.outputs.date }}
          cache-from: type=gha,scope=source-image
          cache-to: type=gha,mode=max,scope=source-image

  binaries:
    name: Release archive (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [plan, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04-arm}
          - {goos: darwin, goarch: amd64, runner: macos-15-intel}
          - {goos: darwin, goarch: arm64, runner: macos-15}
          - {goos: windows, goarch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build-inputs
          path: .
      - name: Fetch Go dependencies with bounded transport retries
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python scripts/go_mod_download.py
      - name: Fetch Go dependencies with bounded transport retries
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: python3 scripts/go_mod_download.py
      - name: Test the database with the release's pure-Go build settings
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/db ./internal/buildinfo
      - name: Build, smoke-test and package native binaries
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_EPOCH: ${{ needs.plan.outputs.epoch }}
        run: python scripts/release.py package --version "$env:RELEASE_VERSION" --epoch "$env:RELEASE_EPOCH" --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} --output dist/bundles
        if: runner.os == 'Windows'
      - name: Build, smoke-test and package native binaries
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_EPOCH: ${{ needs.plan.outputs.epoch }}
        run: python3 scripts/release.py package --version "$RELEASE_VERSION" --epoch "$RELEASE_EPOCH" --goos ${{ matrix.goos }} --goarch ${{ matrix.goarch }} --output dist/bundles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bundles/*
          if-no-files-found: error
          retention-days: 7

  image:
    name: Assemble release and matching Docker image
    needs: [plan, frontend, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build-inputs
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-bundle-*
          path: dist/downloads
          merge-multiple: true
      - name: Verify all five bundles and assemble image inputs
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: python3 scripts/release.py collect --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --source dist/downloads --output dist/release
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to Docker Hub for publication
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - name: Sign in to the linked GitHub container registry
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: |
            atharvnaphade/carbonpanel
            ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.version }},enable=${{ needs.plan.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.plan.outputs.prerelease == 'false' }}
      - name: Assemble both architectures from the tested release binaries
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/image
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.plan.outputs.publish == 'true' }}
          outputs: ${{ needs.plan.outputs.publish != 'true' && 'type=oci,dest=dist/image.oci.tar' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Carbon Panel
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.commit }}
            org.opencontainers.image.url=https://carbonpanel.dev/
            org.opencontainers.image.documentation=https://carbonpanel.dev/docs/
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: APP_VERSION=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
      - name: Sync Docker Hub repository description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        if: needs.plan.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
          repository: atharvnaphade/carbonpanel
          short-description: Self-hosted Minecraft server and modpack management with Docker.
          enable-url-completion: true
      - name: Confirm both architectures are available in both registries
        if: needs.plan.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GITHUB_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker buildx imagetools inspect "atharvnaphade/carbonpanel@$IMAGE_DIGEST" --raw > dist/image-manifest.json
          python3 scripts/release.py verify-image --manifest dist/image-manifest.json
          docker buildx imagetools inspect "${GITHUB_IMAGE,,}@$IMAGE_DIGEST" --raw > dist/github-image-manifest.json
          python3 scripts/release.py verify-image --manifest dist/github-image-manifest.json
      - name: Record image digest and final download checksums
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/release.py finalize --output dist/release --digest "$IMAGE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-downloads
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete GitHub release
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-downloads
          path: dist/release
      - name: Upload assets to a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: python3 scripts/release.py publish --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" --output dist/release
