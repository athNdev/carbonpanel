# SPDX-License-Identifier: MPL-2.0
# OSS-415: Controller CT (traditional unprivileged amd64 system container).
# PR/branch qualification builds the REAL Debian 13 rootfs and verifies the
# archive, but never writes. Publication consumes that same-run artifact only,
# under an exact main-SHA/API gate and explicit publish=true. No product tag,
# image alias, registry push or general release is touched.
name: Controller CT artifact

on:
  pull_request:
    paths:
      - '.github/workflows/proxmox-controller-ct.yml'
      - 'packaging/proxmox-controller-ct/**'
      - 'scripts/proxmox_controller_ct.py'
      - 'scripts/test_proxmox_controller_ct.py'
      - 'scripts/runtime_artifacts.py'
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact-only version: controller-ct-vMAJOR.MINOR.PATCH'
        required: true
        type: string
      publish:
        description: 'Publish verified same-run artifact as draft prerelease (false stages only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: controller-ct-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Build and verify real CT rootfs (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_sha256: ${{ steps.archive.outputs.sha256 }}
      artifact_name: ${{ steps.archive.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.1
        with:
          python-version: '3.12'
      - name: Targeted fixtures (archive/root shape/ownership/startup/refusal/pin/gate)
        run: python3 -m unittest scripts.test_proxmox_controller_ct -v
      - name: Verify manifest against canonical Stable contract
        run: python3 scripts/proxmox_controller_ct.py verify-manifest
      - name: Install base-build tooling and pin the official Debian 13 key
        env:
          DEBIAN12_FPR: B8B80B5B623EAB6AD8775C45B7C5D7D6350947F8
          DEBIAN13_KEY_URL: https://ftp-master.debian.org/keys/archive-key-13.asc
          DEBIAN13_KEY_FPR: 04B54C3CDCA79751B16BC6B5225629DF75B188BD
          RELEASE13_KEY_URL: https://ftp-master.debian.org/keys/release-13.asc
          RELEASE13_KEY_FPR: 41587F7DB8C774BCCF131416762F67A0B2C39DE4
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring gpg
          # Noble's keyring supplies archive-key-12. Trixie InRelease also needs
          # archive-key-13 and release-13; all three must verify (gpgv exit 0).
          gpg --show-keys --with-colons /usr/share/keyrings/debian-archive-keyring.gpg \
            | grep -q "$DEBIAN12_FPR" || { echo "archive-key-12 missing from host keyring"; exit 1; }
          curl -fsSL "$DEBIAN13_KEY_URL" -o "$RUNNER_TEMP/archive-key-13.asc"
          curl -fsSL "$RELEASE13_KEY_URL" -o "$RUNNER_TEMP/release-13.asc"
          fpr13=$(gpg --show-keys --with-colons "$RUNNER_TEMP/archive-key-13.asc" | awk -F: '$1=="fpr"{print $10; exit}')
          fprrel=$(gpg --show-keys --with-colons "$RUNNER_TEMP/release-13.asc" | awk -F: '$1=="fpr"{print $10; exit}')
          [ "$fpr13" = "$DEBIAN13_KEY_FPR" ] || { echo "unexpected archive-key-13 fingerprint"; exit 1; }
          [ "$fprrel" = "$RELEASE13_KEY_FPR" ] || { echo "unexpected release-13 fingerprint"; exit 1; }
          gpg --dearmor < "$RUNNER_TEMP/archive-key-13.asc" > "$RUNNER_TEMP/archive-key-13.gpg"
          gpg --dearmor < "$RUNNER_TEMP/release-13.asc" > "$RUNNER_TEMP/release-13.gpg"
          cat /usr/share/keyrings/debian-archive-keyring.gpg \
            "$RUNNER_TEMP/archive-key-13.gpg" "$RUNNER_TEMP/release-13.gpg" \
            > "$RUNNER_TEMP/debian-archive-keyring-trixie.gpg"
      - name: Resolve base/runtime values from manifest (no literals in shell)
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          m = json.load(open("packaging/proxmox-controller-ct/manifest.json"))
          r = m["runtime"]
          p = json.load(open("packaging/proxmox-controller-ct/docker-packages.json"))
          print(f"CT_APT_SUITE={r['apt_suite']}")
          print(f"CT_APT_REPO={r['apt_repo']}")
          print(f"CT_KEY_FINGERPRINT={r['apt_key_fingerprint']}")
          print("CT_PACKAGES=" + " ".join(p["packages"]))
          PY
      - name: debootstrap signed Debian 13 base
        run: |
          sudo debootstrap --force-check-gpg --keyring "$RUNNER_TEMP/debian-archive-keyring-trixie.gpg" \
            --arch=amd64 --variant=minbase \
            "$CT_APT_SUITE" "$RUNNER_TEMP/rootfs" https://deb.debian.org/debian
          sudo install -d "$RUNNER_TEMP/rootfs/etc/apt/trusted.gpg.d"
          sudo cp "$RUNNER_TEMP/debian-archive-keyring-trixie.gpg" \
            "$RUNNER_TEMP/rootfs/etc/apt/trusted.gpg.d/debian-archive-key-13.gpg"
      - name: Provision signed Docker/upstream packages into the rootfs
        run: |
          curl -fsSL "$(python3 -c 'import json;print(json.load(open("packaging/proxmox-controller-ct/manifest.json"))["runtime"]["apt_key_url"])')" -o "$RUNNER_TEMP/docker.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/docker.asc" | awk -F: '$1=="fpr"{print $10; exit}' \
            | grep -Fxq "$CT_KEY_FINGERPRINT" || { echo "Docker key fingerprint mismatch"; exit 1; }
          # Docker serves ASCII armor; apt signed-by needs a binary keyring.
          gpg --dearmor < "$RUNNER_TEMP/docker.asc" > "$RUNNER_TEMP/docker.gpg"
          sudo install -d "$RUNNER_TEMP/rootfs/work"
          sudo cp "$RUNNER_TEMP/docker.gpg" "$RUNNER_TEMP/rootfs/work/docker.gpg"
          sudo cp packaging/proxmox-controller-ct/prepare-packages.sh "$RUNNER_TEMP/rootfs/prepare.sh"
          sudo tee "$RUNNER_TEMP/rootfs/run-prepare.sh" >/dev/null <<EOF
          #!/bin/bash
          set -euo pipefail
          export CT_APT_SUITE="$CT_APT_SUITE"
          export CT_APT_REPO="$CT_APT_REPO"
          export CT_KEY_FINGERPRINT="$CT_KEY_FINGERPRINT"
          export CT_PACKAGES="$CT_PACKAGES"
          exec /bin/bash /prepare.sh
          EOF
          sudo chmod +x "$RUNNER_TEMP/rootfs/run-prepare.sh"
          sudo chroot "$RUNNER_TEMP/rootfs" /run-prepare.sh
          sudo cp "$RUNNER_TEMP/rootfs/work/package-receipt.json" "$RUNNER_TEMP/package-receipt.json"
      - name: Assemble, archive and verify the final rootfs
        id: archive
        env:
          CT_VERSION: ${{ inputs.version || 'controller-ct-v0.0.0' }}
        run: |
          PY="$(command -v python3)"
          sudo "$PY" scripts/proxmox_controller_ct.py build --staging "$RUNNER_TEMP/rootfs" \
            --prepared-rootfs "$RUNNER_TEMP/rootfs" --docker-key "$RUNNER_TEMP/docker.gpg" \
            --package-receipt "$RUNNER_TEMP/package-receipt.json"
          VER="$CT_VERSION"
          sudo systemctl --root="$RUNNER_TEMP/rootfs" enable carbon-panel-ct-firstboot.service
          sudo "$PY" scripts/proxmox_controller_ct.py make-archive --staging "$RUNNER_TEMP/rootfs" \
            --out "$RUNNER_TEMP/carbonpanel-controller-ct.tar.zst" --version "$VER"
          "$PY" scripts/proxmox_controller_ct.py verify-archive \
            --archive "$RUNNER_TEMP/carbonpanel-controller-ct.tar.zst" \
            --checksum "$RUNNER_TEMP/carbonpanel-controller-ct.tar.zst.sha256"
          "$PY" scripts/proxmox_controller_ct.py check-firstboot
          sudo chown "$USER:$USER" "$RUNNER_TEMP/carbonpanel-controller-ct.tar.zst" \
            "$RUNNER_TEMP/carbonpanel-controller-ct.tar.zst.sha256" \
            "$RUNNER_TEMP/package-receipt.json"
          sum=$(sha256sum "$RUNNER_TEMP/carbonpanel-controller-ct.tar.zst" | cut -d' ' -f1)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "name=controller-ct-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Upload the exact verified artifact for this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-ct-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/carbonpanel-controller-ct.tar.zst
            ${{ runner.temp }}/carbonpanel-controller-ct.tar.zst.sha256
            ${{ runner.temp }}/package-receipt.json
          if-no-files-found: error

  gate:
    name: Exact main-SHA/API publication gate
    needs: qualify
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trust only github.sha on refs/heads/main
        run: |
          [ "${{ github.ref }}" = "refs/heads/main" ] || { echo "dispatch must be on main"; exit 1; }
          main_sha=$(gh api "repos/${{ github.repository }}/branches/main" --jq .commit.sha)
          [ "$main_sha" = "${{ github.sha }}" ] || { echo "github.sha is not current main"; exit 1; }
      - name: Verify exact-commit main CI succeeded
        id: ci
        run: python3 scripts/runtime_artifacts.py verify-main-ci --commit "${{ github.sha }}"
      - name: Publication decision (source/workflow attestation, no textual secret)
        id: gate
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          ART_SHA: ${{ needs.qualify.outputs.artifact_sha256 }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          identity="oss-runtime $REPOSITORY $RUN_ID $VERSION ${SHA:0:12} ${ART_SHA:0:12}"
          args=(--event workflow_dispatch --ref refs/heads/main --trusted-sha "$SHA"
                --version "$VERSION" --artifact-sha256 "$ART_SHA" --identity "$identity" --publish)
          [ "$CI_VERIFIED" = "true" ] && args+=(--ci-success)
          python3 scripts/proxmox_controller_ct.py publish-gate "${args[@]}" > "$RUNNER_TEMP/gate.json"
          allowed=$(python3 -c 'import json,sys;print("true" if json.load(open(sys.argv[1]))["allowed"] else "false")' "$RUNNER_TEMP/gate.json")
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          [ "$allowed" = "true" ] || { cat "$RUNNER_TEMP/gate.json"; exit 1; }

  publish-select:
    name: Draft artifact-only preview release
    needs: [qualify, gate]
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.1
        with:
          python-version: '3.12'
      - name: Download the exact same-run artifact (never rebuild)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
          path: ${{ runner.temp }}/ct-release
      - name: Re-verify the downloaded artifact against the qualified digest
        env:
          EXPECTED: ${{ needs.qualify.outputs.artifact_sha256 }}
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/ct-release/carbonpanel-controller-ct.tar.zst" | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED" ] || { echo "artifact digest drift; refusing"; exit 1; }
          python3 scripts/proxmox_controller_ct.py verify-archive --require-real \
            --archive "$RUNNER_TEMP/ct-release/carbonpanel-controller-ct.tar.zst" \
            --checksum "$RUNNER_TEMP/ct-release/carbonpanel-controller-ct.tar.zst.sha256"
      - name: Create draft prerelease only (never product release or latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          EXPECTED: ${{ needs.qualify.outputs.artifact_sha256 }}
        run: |
          case "$VERSION" in controller-ct-v*) ;; *) echo "wrong version domain"; exit 1 ;; esac
          receipt="$RUNNER_TEMP/ct-release/package-receipt.json"
          [ -f "$receipt" ] || { echo "package receipt missing"; exit 1; }
          checksum_sha=$(sha256sum "$RUNNER_TEMP/ct-release/carbonpanel-controller-ct.tar.zst.sha256" | cut -d' ' -f1)
          receipt_sha=$(sha256sum "$receipt" | cut -d' ' -f1)
          gh release create "$VERSION" --draft --prerelease --latest=false --target "$SHA" \
            --title "Controller CT preview $VERSION" \
            --notes "Artifact-only Debian 13 controller CT preview. Not a Carbon Panel product release, image alias or latest release. Package receipt is attached as package-receipt.json." \
            "$RUNNER_TEMP/ct-release/carbonpanel-controller-ct.tar.zst" \
            "$RUNNER_TEMP/ct-release/carbonpanel-controller-ct.tar.zst.sha256" \
            "$receipt"
          # gh release view uses GraphQL and can see drafts; REST releases/tags
          # cannot. Validate the immutable release-id URL before any write.
          view=$(gh release view "$VERSION" --repo "$REPO" \
            --json apiUrl,isDraft,tagName,targetCommitish)
          api_url=$(python3 scripts/ct_release_draft_gate.py draft-url \
            --view "$view" --version "$VERSION" --sha "$SHA")
          assets=$(gh api "$api_url" --jq '.assets[] | "\(.name) \(.digest)"')
          python3 scripts/ct_release_draft_gate.py verify-assets \
            --assets "$assets" --archive-sha "$EXPECTED" \
            --checksum-sha "$checksum_sha" --receipt-sha "$receipt_sha"
          gh release edit "$VERSION" --draft=false --prerelease --latest=false
