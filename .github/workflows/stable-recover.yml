# SPDX-License-Identifier: MPL-2.0
name: Recover interrupted Stable publication
on:
  workflow_dispatch:
    inputs:
      release_run:
        description: 'Completed, interrupted trusted Stable publication run ID'
        required: true
        type: string

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: github-pages
    permissions:
      actions: read
      deployments: read
      contents: write # authenticated reads of the prepared, unpublished draft
      packages: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_RUN: ${{ inputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Authenticate the source run before accessing its artifacts
        run: |
          [[ "$ORIGINAL_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" | jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name==$repo and .head_repository.full_name==$repo and .head_branch=="main" and
            .path==".github/workflows/release.yml" and .event=="workflow_dispatch" and .status=="completed" and
            (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")'
      - name: Download retained transaction and both Pages archives
        run: |
          for name in stable-transaction-plan github-pages-prior-stable github-pages; do
            gh run download "$ORIGINAL_RUN" --name "$name" --dir "retained/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          for name, target in (("github-pages-prior-stable","prior"), ("github-pages","candidate")):
              with tarfile.open(Path("retained", name, "artifact.tar")) as archive:
                  archive.extractall(Path("retained", target), filter="data")
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the current release, deployment and aliases and recover each owned alias
        id: recovery
        run: |
          python3 -m scripts.stable_recovery recover --prior retained/prior --candidate retained/candidate \
            --journal retained/stable-transaction-plan/transaction.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.recovery.outputs.restore_pages == 'true'
        with:
          path: retained/prior
          retention-days: 30
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.recovery.outputs.restore_pages == 'true'
      - name: Verify the restored public Pages bytes
        run: python3 scripts/docs_publication_gate.py verify-prior-bytes --site retained/prior --base-url https://carbonpanel.dev
