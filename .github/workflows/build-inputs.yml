# SPDX-License-Identifier: MPL-2.0
name: Developer and module build inputs
on:
  pull_request:
    paths:
      - 'scripts/dev*'
      - 'scripts/proto-generate*'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'scripts/testdata/dev-process/**'
      - 'cmd/carbon-dev-supervisor/**'
      - 'scripts/windows-verification-evidence.ps1'
      - 'scripts/test-windows-verification-evidence.ps1'
      - 'scripts/windows-clean-profile-ci.ps1'
      - 'scripts/test-windows-clean-profile-ci.ps1'
      - 'scripts/testdata/windows-firewall-control/**'
      - 'web/carbon-panel/vite.config.ts'
      - 'Makefile'
      - '.air.toml'
      - 'docker/Dockerfile.geyser'
      - 'docker/Dockerfile.status'
      - 'docker/Dockerfile.carbon-panel'
      - 'cmd/geyser/**'
      - 'cmd/status/**'
      - 'pkg/proto/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/build-inputs.yml'
  push:
    branches: [main]
    paths:
      - 'Makefile'
      - '.air.toml'
      - 'scripts/dev*'
      - 'scripts/proto-generate*'
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'scripts/testdata/dev-process/**'
      - 'cmd/carbon-dev-supervisor/**'
      - 'scripts/windows-verification-evidence.ps1'
      - 'scripts/test-windows-verification-evidence.ps1'
      - 'scripts/windows-clean-profile-ci.ps1'
      - 'scripts/test-windows-clean-profile-ci.ps1'
      - 'scripts/testdata/windows-firewall-control/**'
      - 'web/carbon-panel/vite.config.ts'
      - 'docker/Dockerfile.geyser'
      - 'docker/Dockerfile.status'
      - 'docker/Dockerfile.carbon-panel'
      - 'cmd/geyser/**'
      - 'cmd/status/**'
      - 'pkg/proto/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/build-inputs.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-proto:
    name: Generated proto output (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.50.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
        working-directory: web/carbon-panel
      - run: bun scripts/proto-generate.mjs --check
  launcher:
    name: Development launcher (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun test scripts/dev.test.ts
      - run: bun test scripts/proto-generate.test.mjs
      - name: Check Windows qualification evidence policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-windows-verification-evidence.ps1
          ./scripts/test-windows-clean-profile-ci.ps1
          go test ./scripts/testdata/windows-firewall-control
  module-images:
    name: Build module image (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [geyser, status]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile.${{ matrix.module }} .
  panel-image:
    name: Build panel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build without publishing
        run: docker buildx build --platform linux/amd64 --file docker/Dockerfile.carbon-panel .
