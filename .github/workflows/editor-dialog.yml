# SPDX-License-Identifier: MPL-2.0
name: Editor dialog browser regression

on:
  pull_request:
    paths:
      - 'web/carbon-panel/**'
      - 'scripts/manual-review/e2e/editor-dialog/**'
      - 'scripts/manual-review/e2e/editor-dialog-check.mjs'
      - 'scripts/manual-review/e2e/server-inventory-check.mjs'
      - 'scripts/manual-review/e2e/module-forms/**'
      - 'scripts/manual-review/e2e/module-forms-check.mjs'
      - 'scripts/manual-review/e2e/websocket-browser/**'
      - 'scripts/manual-review/e2e/websocket-reconnect-check.mjs'
      - 'scripts/manual-review/e2e/package.json'
      - 'scripts/manual-review/e2e/bun.lock'
      - '.github/workflows/editor-dialog.yml'
  push:
    branches: [main]
    paths:
      - 'web/carbon-panel/**'
      - 'scripts/manual-review/e2e/editor-dialog/**'
      - 'scripts/manual-review/e2e/editor-dialog-check.mjs'
      - 'scripts/manual-review/e2e/server-inventory-check.mjs'
      - 'scripts/manual-review/e2e/module-forms/**'
      - 'scripts/manual-review/e2e/module-forms-check.mjs'
      - 'scripts/manual-review/e2e/websocket-browser/**'
      - 'scripts/manual-review/e2e/websocket-reconnect-check.mjs'
      - 'scripts/manual-review/e2e/package.json'
      - 'scripts/manual-review/e2e/bun.lock'
      - '.github/workflows/editor-dialog.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-dialog:
    name: File editor in Chromium
    # Playwright install-deps uses the Microsoft apt repo, which returns HTTP
    # 403 for Ubuntu 26.04 (ubuntu-latest); the noble repo is still published.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # runner.temp is only available in step context, not job-level env.
      # Derive the owned browser cache from RUNNER_TEMP and export it to every
      # subsequent step; no global browser install and no GC override.
      - name: Configure private browser cache
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/carbonpanel-editor-browsers" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install frontend dependencies
        working-directory: web/carbon-panel
        run: bun install --frozen-lockfile
      - name: Install browser harness
        working-directory: scripts/manual-review/e2e
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: scripts/manual-review/e2e
        run: bunx playwright install --with-deps chromium
      - name: Exercise real dialog and Monaco with deferred RPCs
        working-directory: scripts/manual-review/e2e
        run: bun run editor-dialog
      - name: Verify compiled editor views and worker serving
        working-directory: scripts/manual-review/e2e
        run: node editor-dialog-check.mjs --production
      - name: Exercise WebSocket reconnection in Chromium
        working-directory: scripts/manual-review/e2e
        run: node websocket-reconnect-check.mjs
      - name: Exercise real server inventory routes and delayed RPCs
        working-directory: scripts/manual-review/e2e
        run: node server-inventory-check.mjs
      - name: Exercise real module form requests and persisted volume roundtrips
        working-directory: scripts/manual-review/e2e
        run: node module-forms-check.mjs
