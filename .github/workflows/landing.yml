# One Pages artifact: homepage at the custom domain root, pinned docs at /docs/.

name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'docs/carbon-panel/**'
      - 'docs/design-system/**'
      - 'web/carbon-panel/src/lib/**'
      - 'web/carbon-panel/demo/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/studio/**'
      - 'docs/website-source.json'
      - 'scripts/build_website.py'
      - 'scripts/check_website.py'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and validate the combined website
        run: |
          python3 scripts/build_website.py
          python3 scripts/check_website.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .website-build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  indexable-changes:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.detect.outputs.urls }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed public pages
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          urls='[]'
          add_url() {
            urls=$(jq --arg url "$1" '. + [$url] | unique' <<<"$urls")
          }

          if [ "$GITHUB_EVENT_NAME" != "push" ] ||
             [ -z "$BEFORE_SHA" ] ||
             [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            printf 'urls<<EOF\n%s\nEOF\n' "$urls" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              landing/index.html)
                add_url 'https://carbonpanel.dev/'
                ;;
              landing/llms.txt)
                add_url 'https://carbonpanel.dev/llms.txt'
                ;;
              docs/design-system/*)
                add_url 'https://carbonpanel.dev/design-system/'
                ;;
              docs/carbon-panel/src/content/docs/*.md|docs/carbon-panel/src/content/docs/*.mdx)
                route="${path#docs/carbon-panel/src/content/docs/}"
                route="${route%.md}"
                route="${route%.mdx}"
                if [ "$route" = "index" ]; then
                  route=''
                elif [[ "$route" == */index ]]; then
                  route="${route%/index}"
                fi
                url="https://carbonpanel.dev/docs/"
                [ -z "$route" ] || url="${url}${route}/"
                add_url "$url"
                ;;
            esac
          done < <(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")

          printf 'urls<<EOF\n%s\nEOF\n' "$urls" >> "$GITHUB_OUTPUT"

  notify-indexnow:
    needs: [deploy, indexable-changes]
    if: needs.indexable-changes.outputs.urls != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: indexnow-carbonpanel
      cancel-in-progress: false
    steps:
      - name: Restore IndexNow cooldown
        id: cooldown
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .indexnow-cooldown
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            indexnow-${{ github.repository }}-
      - name: Check IndexNow cooldown
        id: cooldown-check
        run: |
          if [ -f .indexnow-cooldown/last-notified ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "IndexNow was notified recently; skipping this notification."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify IndexNow
        if: steps.cooldown-check.outputs.allowed == 'true'
        env:
          INDEXNOW_KEY: carbonpanel-indexnow-7f4c9e2b
          INDEXNOW_URLS: ${{ needs.indexable-changes.outputs.urls }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -n \
              --arg host 'carbonpanel.dev' \
              --arg key "$INDEXNOW_KEY" \
              --arg keyLocation "https://carbonpanel.dev/$INDEXNOW_KEY.txt" \
              --argjson urlList "$INDEXNOW_URLS" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"
          mkdir -p .indexnow-cooldown
          date -u +%FT%TZ > .indexnow-cooldown/last-notified
      - name: Save IndexNow cooldown
        if: steps.cooldown-check.outputs.allowed == 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .indexnow-cooldown
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
