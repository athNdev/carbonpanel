# One Pages artifact: homepage at the custom domain root, pinned docs at /docs/.
# An ordinary main merge builds and validates the site but does not deploy it;
# deployment requires workflow_dispatch with deploy=true.

name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'docs/carbon-panel/**'
      - 'docs/design-system/**'
      - 'web/carbon-panel/src/lib/**'
      - 'web/carbon-panel/demo/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/studio/**'
      - 'docs/website-source.json'
      - 'scripts/build_website.py'
      - 'scripts/check_website.py'
      - '.github/workflows/landing.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'EXPLICIT Pages deployment opt-in: publish the built site (off = build and validate only)'
        required: true
        default: false
        type: boolean

# Least privilege: build/indexing jobs are read-only; Pages write and OIDC
# token permissions belong only to the job that actually deploys.
permissions:
  contents: read
  actions: read

# Deployments are serialized channel-wide and never cancelled by the routine
# per-SHA verification builds; alias/artifact writes stay coherent.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && 'pages-deploy' || format('pages-verify-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.deploy }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal main merge builds and validates only. Publishing Pages needs an
    # explicit dispatch opt-in; the workflow itself stays active.
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
      contract: ${{ steps.contract.outputs.verified }}
      docs_qualified: ${{ steps.docs_gate.outputs.qualified }}
      transaction_action: ${{ steps.transaction.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact main CI for the dispatch commit
        id: ci
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py verify-main-ci --commit "$CI_COMMIT"
      - name: Decide Pages publication (explicit opt-in only)
        id: channel
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_OPT_IN: ${{ inputs.deploy }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          python3 scripts/release.py developer-channel-gate \
            --event "$CHANNEL_EVENT" --opt-in "$CHANNEL_OPT_IN" \
            --ref "$CHANNEL_REF" --ci-verified "$CHANNEL_CI_VERIFIED"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and validate the combined website
        run: |
          python3 scripts/build_website.py
          python3 scripts/check_website.py

      # OSS-413 docs promotion gate. The BUILT site's public version-index.json
      # must satisfy the schema_version 3 two-channel contract (Stable +
      # Nightly only, no legacy doc snapshots, full-SHA pinned links) and pin
      # the exact trusted-main source revision. Stale docs never mask a
      # candidate; these steps fail the build closed before any deploy.
      - name: Validate the built channel contract
        id: contract
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/release.py validate-channel-contract --path .website-build/site/version-index.json

      - name: Gate docs source revision and qualified stage
        id: docs_gate
        if: github.event_name == 'workflow_dispatch'
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_COMMIT: ${{ github.sha }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          CONTRACT=$(cat .website-build/site/version-index.json)
          python3 scripts/release.py channel-source-gate \
            --event "$CHANNEL_EVENT" --ref "$CHANNEL_REF" --commit "$CHANNEL_COMMIT" \
            --ci-verified "$CHANNEL_CI_VERIFIED" --contract "$CONTRACT" \
            --docs-validated "true"

      # A manual/site-only deploy never originates a channel promotion. It may
      # republish ONLY the exact source already active in both registries and
      # the public docs marker, reconstructed from the live state as a receipt.
      - name: Reconstruct the active channel source from live state
        id: active_source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALIASES=$(python3 scripts/release.py channel-observe --reference nightly | jq -c .observations)
          LIVE=$(curl -fsSL https://carbonpanel.dev/version-index.json | jq -c '.channels.nightly')
          printf 'aliases=%s\n' "$ALIASES" >> "$GITHUB_OUTPUT"
          echo "commit=$(printf '%s' "$LIVE" | jq -r '.commit // empty')" >> "$GITHUB_OUTPUT"
          echo "digest=$(printf '%s' "$LIVE" | jq -r '.image.digest // empty')" >> "$GITHUB_OUTPUT"
      - name: Gate site-only dispatch to an already-active exact source
        id: transaction
        if: github.event_name == 'workflow_dispatch'
        env:
          ALIASES: ${{ steps.active_source.outputs.aliases }}
          COMMIT: ${{ steps.active_source.outputs.commit }}
          DIGEST: ${{ steps.active_source.outputs.digest }}
        run: |
          PREVIOUS=$(python3 scripts/release.py channel-active-receipt \
            --channel nightly --aliases "$ALIASES" \
            --docs-commit "$COMMIT" --docs-digest "$DIGEST")
          PREV_JSON=$(printf '%s' "$PREVIOUS" | jq -c .receipt)
          CANDIDATE=$(printf '%s' "$PREV_JSON" | jq -c \
            '{channel:"nightly",commit:.revision,digest:.digest,seq:(.seq+1),
              source_ref:"refs/heads/main",ci_verified:"true",immutable_ok:true,
              contract_valid:true,site_validated:true,docs_commit:.docs_commit,
              docs_digest:.docs_digest,registries:.registries,
              candidate_marker_verified:true,marker_urls:.marker_urls}')
          LIVE=$(jq -nc --arg c "$COMMIT" --arg d "$DIGEST" --argjson a "$ALIASES" \
            '{registries:{docker_hub:$a.docker_hub[1].digest,ghcr:$a.ghcr[1].digest},
              docs_commit:$c,docs_digest:$d}')
          python3 scripts/release.py channel-transaction \
            --candidate "$CANDIDATE" --previous "$PREV_JSON" --live "$LIVE" \
            --event workflow_dispatch

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .website-build/site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.docs_qualified == 'true' && needs.build.outputs.contract == 'true' && needs.build.outputs.transaction_action == 'noop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexable-changes:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.detect.outputs.urls }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed public pages
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          paths=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] &&
             [ -n "$BEFORE_SHA" ] &&
             [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            paths=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi
          urls=$(python3 scripts/release.py indexable-urls \
            --event "$GITHUB_EVENT_NAME" --before "$BEFORE_SHA" --paths "$paths")
          printf 'urls<<EOF\n%s\nEOF\n' "$urls" >> "$GITHUB_OUTPUT"

  # Deliberate deferral: indexable-changes derives URLs only from a push diff,
  # but deploy now runs only on an explicit dispatch. A dispatch deploy yields
  # no URLs, so no IndexNow notification is sent. Documented in docs/releases.md
  # and covered by a dry-run fixture; no notification is attempted here.
  notify-indexnow:
    needs: [deploy, indexable-changes]
    if: needs.indexable-changes.outputs.urls != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: indexnow-carbonpanel
      cancel-in-progress: false
    steps:
      - name: Restore IndexNow cooldown
        id: cooldown
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-cooldown
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            indexnow-${{ github.repository }}-
      - name: Check IndexNow cooldown
        id: cooldown-check
        run: |
          if [ -f .indexnow-cooldown/last-notified ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "IndexNow was notified recently; skipping this notification."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify IndexNow
        if: steps.cooldown-check.outputs.allowed == 'true'
        env:
          INDEXNOW_KEY: carbonpanel-indexnow-7f4c9e2b
          INDEXNOW_URLS: ${{ needs.indexable-changes.outputs.urls }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -n \
              --arg host 'carbonpanel.dev' \
              --arg key "$INDEXNOW_KEY" \
              --arg keyLocation "https://carbonpanel.dev/$INDEXNOW_KEY.txt" \
              --argjson urlList "$INDEXNOW_URLS" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"
          mkdir -p .indexnow-cooldown
          date -u +%FT%TZ > .indexnow-cooldown/last-notified
      - name: Save IndexNow cooldown
        if: steps.cooldown-check.outputs.allowed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-cooldown
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
