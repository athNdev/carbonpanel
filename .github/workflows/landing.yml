# One Pages artifact: homepage at the custom domain root, pinned docs at /docs/.

name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'docs/carbon-panel/**'
      - 'docs/design-system/**'
      - 'web/carbon-panel/src/lib/**'
      - 'web/carbon-panel/demo/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/studio/**'
      - 'docs/website-source.json'
      - 'scripts/build_website.py'
      - 'scripts/check_website.py'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'

      - name: Build and validate the combined website
        run: |
          python3 scripts/build_website.py
          python3 scripts/check_website.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .website-build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: carbonpanel-indexnow-7f4c9e2b
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -n \
              --arg host 'carbonpanel.dev' \
              --arg key "$INDEXNOW_KEY" \
              --arg keyLocation "https://carbonpanel.dev/$INDEXNOW_KEY.txt" \
              --argjson urlList '[
                "https://carbonpanel.dev/",
                "https://carbonpanel.dev/docs/",
                "https://carbonpanel.dev/llms.txt"
              ]' \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"
