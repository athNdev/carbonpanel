# One Pages artifact: homepage at the custom domain root, pinned docs at /docs/.
# An ordinary main merge builds and validates the site but does not deploy it;
# deployment requires workflow_dispatch with deploy=true.

name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - 'docs/carbon-panel/**'
      - 'docs/design-system/**'
      - 'web/carbon-panel/src/lib/**'
      - 'web/carbon-panel/demo/**'
      - 'web/carbon-panel/package.json'
      - 'web/carbon-panel/bun.lock'
      - 'web/carbon-panel/src/routes/servers/**'
      - 'web/carbon-panel/src/routes/modpacks/studio/**'
      - 'docs/website-source.json'
      - 'scripts/build_website.py'
      - 'scripts/check_website.py'
      - '.github/workflows/landing.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'EXPLICIT Pages deployment opt-in: publish the built site (off = build and validate only)'
        required: true
        default: false
        type: boolean

# Least privilege: build/indexing jobs are read-only; Pages write and OIDC
# token permissions belong only to the job that actually deploys.
permissions:
  contents: read
  actions: read

# Keep the deployment lock for both the build and the write. Verification
# runs use their own keys and can run alongside a deployment.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && vars.NIGHTLY_RECOVERY_ACTIVE != 'true' && inputs.deploy && 'pages-deploy' || format('pages-verify-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal main merge builds and validates only. Publishing Pages needs an
    # explicit dispatch opt-in; the workflow itself stays active.
    outputs:
      publish: ${{ steps.channel.outputs.publish }}
      contract: ${{ steps.contract.outputs.verified }}
      live_index: ${{ steps.live_state.outputs.index }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact main CI for the dispatch commit
        id: ci
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_COMMIT: ${{ github.sha }}
        run: python3 scripts/release.py verify-main-ci --commit "$CI_COMMIT"
      - name: Decide Pages publication (explicit opt-in only)
        id: channel
        if: vars.NIGHTLY_RECOVERY_ACTIVE != 'true'
        env:
          CHANNEL_EVENT: ${{ github.event_name }}
          CHANNEL_OPT_IN: ${{ inputs.deploy }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          python3 scripts/release.py developer-channel-gate \
            --event "$CHANNEL_EVENT" --opt-in "$CHANNEL_OPT_IN" \
            --ref "$CHANNEL_REF" --ci-verified "$CHANNEL_CI_VERIFIED"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.50.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Qualify the active public docs before a site-only deployment
        id: live_state
        if: steps.channel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_REF: ${{ github.ref }}
          CHANNEL_COMMIT: ${{ github.sha }}
          CHANNEL_CI_VERIFIED: ${{ steps.ci.outputs.verified }}
        run: |
          python3 scripts/release.py channel-source-gate \
            --event "$GITHUB_EVENT_NAME" --ref "$CHANNEL_REF" --commit "$CHANNEL_COMMIT" \
            --ci-verified "$CHANNEL_CI_VERIFIED"
          mkdir -p .website-build
          curl -fsSL https://carbonpanel.dev/version-index.json \
            -o .website-build/live-version-index.json
          curl -fsSL https://carbonpanel.dev/docs/version-index.json \
            -o .website-build/live-docs-version-index.json
          cmp .website-build/live-version-index.json .website-build/live-docs-version-index.json
          printf 'index=%s\n' "$(jq -c . .website-build/live-version-index.json)" >> "$GITHUB_OUTPUT"
          python3 scripts/docs_publication_gate.py resolve-live-docs-state \
            --path .website-build/live-version-index.json --verify-stable --require-nightly-parity

      - name: Build and validate the combined website
        env:
          LIVE_STATE: ${{ steps.live_state.outputs.state }}
          LIVE_REVISION: ${{ steps.live_state.outputs.revision }}
          LIVE_DIGEST: ${{ steps.live_state.outputs.digest }}
          LIVE_RECEIPT: ${{ steps.live_state.outputs.receipt }}
          CARBONPANEL_STABLE_TAG: ${{ steps.live_state.outputs.stable_tag }}
          CARBONPANEL_STABLE_REVISION: ${{ steps.live_state.outputs.stable_revision }}
          CARBONPANEL_STABLE_DIGEST: ${{ steps.live_state.outputs.stable_digest }}
        run: |
          if [ "$LIVE_STATE" = final ]; then
            python3 scripts/build_website.py --nightly-revision "$LIVE_REVISION" \
              --nightly-digest "$LIVE_DIGEST" --promotion-state final \
              --promotion-receipt "$LIVE_RECEIPT"
            python3 scripts/check_website.py --expect-nightly-revision "$LIVE_REVISION" \
              --expect-nightly-digest "$LIVE_DIGEST" --expect-promotion-state final \
              --expect-promotion-receipt "$LIVE_RECEIPT"
          else
            python3 scripts/build_website.py
            python3 scripts/check_website.py
          fi

      - name: Verify channel and maintained guide receipts in the site-only artifact
        id: contract
        if: steps.channel.outputs.publish == 'true'
        run: |
          GATE=scripts/docs_publication_gate.py
          LIVE=.website-build/live-version-index.json
          SITE=.website-build/site
          python3 "$GATE" validate-channel-contract --path "$SITE/version-index.json" --stable-source "$LIVE"
          python3 "$GATE" verify-docs-receipt --built "$SITE/version-index.json" --live "$LIVE"
          python3 "$GATE" guide-fingerprint --declaration docs/maintained-guides.json \
            --revision "$GITHUB_SHA" --root "$GITHUB_WORKSPACE" > .guide-fingerprint.json
          python3 "$GATE" verify-maintained-guides --site "$SITE" --revision "$GITHUB_SHA"
          python3 "$GATE" stamp-publication-receipt --site "$SITE" --candidate .guide-fingerprint.json \
            --live "$LIVE" --revision "$GITHUB_SHA"
          python3 "$GATE" verify-publication-receipt --site "$SITE" --candidate .guide-fingerprint.json \
            --live "$LIVE" --revision "$GITHUB_SHA"
          python3 "$GATE" verify-rendered-guides --site "$SITE" --live "$LIVE" --root "$GITHUB_WORKSPACE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .website-build/site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && needs.build.outputs.contract == 'true' && vars.NIGHTLY_RECOVERY_ACTIVE != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck the exact main pin and live channel receipt before the Pages write
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_INDEX: ${{ needs.build.outputs.live_index }}
        run: |
          GATE=scripts/docs_publication_gate.py
          python3 "$GATE" recheck-main-tip --repository "$GITHUB_REPOSITORY" --expected "$GITHUB_SHA"
          printf '%s\n' "$LIVE_INDEX" > .predeploy-live-index.json
          curl -fsSL https://carbonpanel.dev/version-index.json -o .public-index.json
          python3 "$GATE" verify-docs-receipt --built .public-index.json --live .predeploy-live-index.json
          python3 "$GATE" resolve-live-docs-state --path .public-index.json --verify-stable --require-nightly-parity
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexable-changes:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.detect.outputs.urls }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed public pages
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          paths=""
          if [ "$GITHUB_EVENT_NAME" = "push" ] &&
             [ -n "$BEFORE_SHA" ] &&
             [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            paths=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          fi
          urls=$(python3 scripts/release.py indexable-urls \
            --event "$GITHUB_EVENT_NAME" --before "$BEFORE_SHA" --paths "$paths")
          printf 'urls<<EOF\n%s\nEOF\n' "$urls" >> "$GITHUB_OUTPUT"

  # Deliberate deferral: indexable-changes derives URLs only from a push diff,
  # but deploy now runs only on an explicit dispatch. A dispatch deploy yields
  # no URLs, so no IndexNow notification is sent. Documented in docs/releases.md
  # and covered by a dry-run fixture; no notification is attempted here.
  notify-indexnow:
    needs: [deploy, indexable-changes]
    if: needs.indexable-changes.outputs.urls != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: indexnow-carbonpanel
      cancel-in-progress: false
    steps:
      - name: Restore IndexNow cooldown
        id: cooldown
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-cooldown
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            indexnow-${{ github.repository }}-
      - name: Check IndexNow cooldown
        id: cooldown-check
        run: |
          if [ -f .indexnow-cooldown/last-notified ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "IndexNow was notified recently; skipping this notification."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify IndexNow
        if: steps.cooldown-check.outputs.allowed == 'true'
        env:
          INDEXNOW_KEY: carbonpanel-indexnow-7f4c9e2b
          INDEXNOW_URLS: ${{ needs.indexable-changes.outputs.urls }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(jq -n \
              --arg host 'carbonpanel.dev' \
              --arg key "$INDEXNOW_KEY" \
              --arg keyLocation "https://carbonpanel.dev/$INDEXNOW_KEY.txt" \
              --argjson urlList "$INDEXNOW_URLS" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')"
          mkdir -p .indexnow-cooldown
          date -u +%FT%TZ > .indexnow-cooldown/last-notified
      - name: Save IndexNow cooldown
        if: steps.cooldown-check.outputs.allowed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-cooldown
          key: indexnow-${{ github.repository }}-${{ github.run_id }}
