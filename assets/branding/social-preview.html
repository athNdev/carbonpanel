<!doctype html>
<!-- SPDX-License-Identifier: MPL-2.0 -->
<!-- Template for scripts/generate_social_cards.py. Artwork uses approved assets. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>$page_title</title>
    <style>
      $font_faces
      * { box-sizing: border-box; }
      body { margin: 0; background: #141414; color: #f1f0ea; font-family: "IBM Plex Sans", sans-serif; }
      .card { position: relative; isolation: isolate; width: ${width}px; height: ${height}px; overflow: hidden; }
      .rails { position: absolute; inset: 0 32px; border-inline: 1px solid #ffffff0d; z-index: -3; }
      .grid { position: absolute; inset: 0 32px 0 544px; z-index: -3; background: repeating-linear-gradient(90deg, transparent 0 95px, #ffffff08 95px 96px); mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
      .brand { position: absolute; left: 64px; top: 51px; width: 224px; height: auto; }
      .copy { position: absolute; left: 64px; top: 178px; z-index: 2; width: 580px; }
      .eyebrow { margin: 0 0 27px; font: 12px/1.4 "IBM Plex Mono", monospace; letter-spacing: .065em; color: #b8b7b0; }
      .eyebrow::before { content: '+'; color: #f1f0ea; margin-right: 15px; }
      h1 { font-size: 88px; line-height: 1.05; font-weight: 400; letter-spacing: -.055em; margin: 0; }
      h1 span { display: block; }
      h1 span + span { color: #aaa99f; }
      .subtitle { margin: 27px 0 0; font-size: 23px; line-height: 1.45; color: #bdbbb2; max-width: 560px; }
      .document h1 { font-size: 72px; letter-spacing: -.045em; }
      .document .subtitle { margin-top: 30px; max-width: 515px; font-size: 22px; }
      .world { position: absolute; width: 1080px; aspect-ratio: 3 / 2; right: -208px; top: -15px; z-index: -2; }
      .world img { display: block; width: 100%; height: auto; }
      .entrance { position: absolute; left: 67.8%; top: 43.5%; width: 4.5%; height: 11.7%; clip-path: polygon(0 0, 100% 4%, 100% 100%, 0 94%); background: radial-gradient(ellipse at 5% 40%, #f2c27a, #a76c30 12%, #5b371e 36%, #19120b 85%); opacity: .94; }
      .veil { position: absolute; inset: 0; background: linear-gradient(90deg, #141414 0%, #141414f5 34%, #14141480 49%, transparent 65%), linear-gradient(0deg, #141414 0%, transparent 27%); z-index: -1; }
      footer { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #ffffff16; padding-top: 19px; font: 12px/1.5 "IBM Plex Mono", monospace; color: #a19f94; }
      .footer-label { font-size: 10px; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <main class="card $variant">
      <div class="rails" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>
      <img class="brand" src="$logo" alt="Carbon Panel" />
      <div class="copy">
        <p class="eyebrow">$eyebrow</p>
        <h1>$title</h1>
        <p class="subtitle">$subtitle</p>
      </div>
      <div class="world" aria-hidden="true">
        <img src="$world" alt="" />
        <div class="entrance"></div>
      </div>
      <div class="veil" aria-hidden="true"></div>
      <footer>
        <span>$url</span><span class="footer-label">$footer_label</span>
      </footer>
    </main>
  </body>
</html>
